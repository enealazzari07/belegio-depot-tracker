   7) KASSENBON-SCANNER  (Kamera + Claude Vision zur Erkennung)
   ============================================================ */
const Scanner = {
  stream:null, torch:false, mehr:false,

  async open(){
    $('#scanner').classList.add('on');
    document.body.style.overflow = 'hidden';
    $('#scanHint').textContent = 'Kassenbon vollständig im Rahmen platzieren';
    try{
      this.stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
      const v = $('#cam'); v.srcObject = this.stream; await v.play();
    }catch(e){
      $('#scanHint').textContent = 'Keine Kamera verfügbar – wähle ein Foto aus der Galerie oder tippe die Daten ein.';
    }
  },

  close(){
    $('#scanner').classList.remove('on');
    document.body.style.overflow = '';
    if(this.stream){ this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    this.torch = false; $('#scanFlash').classList.remove('on');
  },

  async blitz(){
    const track = this.stream && this.stream.getVideoTracks()[0];
    if(!track || !(track.getCapabilities && track.getCapabilities().torch)){ toast('Blitz auf diesem Gerät nicht verfügbar','warn'); return; }
    this.torch = !this.torch;
    try{ await track.applyConstraints({ advanced:[{ torch:this.torch }] });
      $('#scanFlash').classList.toggle('on', this.torch); }catch(e){ toast('Blitz lässt sich nicht schalten','warn'); }
  },

  /* Foto aufnehmen */
  aufnehmen(){
    const v = $('#cam');
    if(!v.videoWidth){ $('#filePick').click(); return; }
    $('#flashfx').classList.add('go'); setTimeout(() => $('#flashfx').classList.remove('go'), 320);
    const c = document.createElement('canvas');
    const maxB = 1400, scale = Math.min(1, maxB / v.videoWidth);
    c.width = v.videoWidth * scale; c.height = v.videoHeight * scale;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    this.verarbeiten(c.toDataURL('image/jpeg', .82));
  },

  ausDatei(file){
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        const scale = Math.min(1, 1400 / img.width);
        c.width = img.width*scale; c.height = img.height*scale;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        this.verarbeiten(c.toDataURL('image/jpeg', .82));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  },

  /* Analyse + Ergebnis-Sheet */
  async verarbeiten(dataUrl){
    this.close();
    sheet('Kassenbon', this.skeleton());
    let daten = null, fehler = null;
    try { daten = await this.ocr(dataUrl); }
    catch(e){ fehler = e.message || 'Analyse fehlgeschlagen'; }
    this.formular(daten, dataUrl, fehler);
  },

  skeleton(){
    return `<div class="card" style="display:flex;align-items:center;gap:14px">
        <span class="ico ico-40" style="background:rgba(26,155,142,.14);color:var(--teal)">${I('spark')}</span>
        <div style="flex:1"><b class="title">Analysiere Kassenbon…</b>
          <div class="tiny muted" style="margin-top:2px">Händler, Betrag und Datum werden ausgelesen</div></div>
      </div>
      <div class="stack" style="margin-top:var(--s2)">
        ${['84px','64px','64px','64px'].map(h => `<div class="card compact" style="display:flex;flex-direction:column;gap:10px;justify-content:center;height:${h}">
          ${sk('40%','11px')}${sk('72%','16px')}</div>`).join('')}
      </div>`;
  },

  /* Claude Vision: strukturierte Extraktion, Antwort ausschließlich als JSON */
  async ocr(dataUrl){
    const base64 = dataUrl.split(',')[1];
    const katListe = DB.ka.map(k => k.name).join(', ');
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{ role:'user', content:[
          { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:base64 } },
          { type:'text', text:
`Lies diesen Kassenbon aus. Antworte AUSSCHLIESSLICH mit reinem JSON, ohne Markdown, ohne Backticks, ohne Einleitung.
Schema:
{"haendler": string, "betrag": number, "datum": "YYYY-MM-DD", "kategorie": string, "notiz": string}
Regeln:
- "betrag" ist der Gesamtbetrag (Summe/Total) als Zahl mit Punkt als Dezimaltrennzeichen.
- "kategorie" muss exakt einer dieser Werte sein: ${katListe}
- "datum" im Format YYYY-MM-DD; wenn unleserlich, nimm ${today()}.
- "notiz" enthält maximal 60 Zeichen mit den auffälligsten Positionen, sonst "".
- Wenn ein Feld nicht lesbar ist, setze null.` }]}]
      })
    });
    if(!res.ok) throw new Error('Die Erkennung ist gerade nicht erreichbar');
    const data = await res.json();
    const text = (data.content||[]).filter(c => c.type==='text').map(c => c.text).join('\n');
    const roh = text.replace(/```json|```/g,'').trim();
    const start = roh.indexOf('{'), ende = roh.lastIndexOf('}');
    if(start < 0) throw new Error('Kassenbon nicht erkannt');
    const j = JSON.parse(roh.slice(start, ende+1));
    const kTreffer = DB.ka.find(k => k.name.toLowerCase() === String(j.kategorie||'').toLowerCase());
    return {
      haendler: j.haendler || '',
      betrag: j.betrag != null ? Number(j.betrag) : '',
      datum: /^\d{4}-\d{2}-\d{2}$/.test(j.datum||'') ? j.datum : today(),
      kategorie: kTreffer ? kTreffer.id : 'k1',
      notiz: j.notiz || ''
    };
  },

  /* Erkannte Daten – vollständig editierbar */
  formular(d, foto, fehler){
    d = d || { haendler:'', betrag:'', datum:today(), kategorie:'k1', notiz:'' };
    window.__bonFoto = foto;
    sheet('Kassenbon prüfen', `
      ${fehler ? `<div class="alert" style="margin-bottom:var(--s3);background:rgba(255,149,0,.1);box-shadow:none">
        ${IC('alert','#ff9500',36,.18)}<div class="txt"><b>${esc(fehler)}</b>
        <span>Trage die Daten von Hand ein – das Foto bleibt gespeichert.</span></div></div>`
        : `<div class="alert" style="margin-bottom:var(--s3);background:rgba(45,157,120,.1);box-shadow:none">
        ${IC('checkCircle','#2d9d78',36,.18)}<div class="txt"><b>Kassenbon erkannt</b>
        <span>Prüfe die Werte und korrigiere, was nicht stimmt.</span></div></div>`}

      <div class="card compact" style="margin-bottom:var(--s3)">
        <label class="kpi-label" for="bBetrag">Betrag</label>
        <input class="input amount-input" id="bBetrag" type="number" inputmode="decimal" step="0.01" value="${d.betrag}" placeholder="0.00">
      </div>
      <div class="field"><label for="bHaendler">Händler</label>
        <input class="input" id="bHaendler" value="${esc(d.haendler)}" placeholder="z. B. Migros"></div>
      <div class="field"><label for="bDatum">Datum</label>
        <input class="input" id="bDatum" type="date" value="${d.datum}"></div>
      <div class="field"><label>Kategorie</label>${katChips(d.kategorie,'bKat')}</div>
      <div class="field"><label>Tags</label>${tagChips([],'bTags')}</div>
      <div class="field"><label for="bNotiz">Notiz</label>
        <textarea class="input" id="bNotiz" placeholder="Optional">${esc(d.notiz)}</textarea></div>

      <div class="btn-row"><button class="btn ghost" onclick="closeSheet()">Abbrechen</button>
        <button class="btn" onclick="Scanner.speichern(false)">Speichern & Weiter</button></div>
      <button class="btn soft" style="margin-top:var(--s2)" onclick="Scanner.speichern(true)">${I('camera')} Speichern & Mehr scannen</button>
    `);
  },

  speichern(weiterScannen){
    const betrag = parseFloat($('#bBetrag').value);
    if(!betrag || betrag <= 0){ toast('Bitte einen Betrag eintragen','warn'); $('#bBetrag').focus(); return; }
    const tx = {
      id:uid(), betrag, kategorie:sel('bKat') || 'k1',
      beschreibung: $('#bHaendler').value.trim() || 'Kassenbon',
      datum: $('#bDatum').value || today(),
      zeit: nowTime(),
      notiz: $('#bNotiz').value.trim() || undefined,
      tags: selMulti('bTags'), quelle:'scan', bon_foto: window.__bonFoto
    };
    Data.addTx(tx);
    closeSheet();
    toast('Kassenbon gespeichert');
    if(weiterScannen) setTimeout(() => Scanner.open(), 360);
  }
};

/* Robusterer Beleg-Scan: Kontrastvariante, zwei Ausleseversuche und valide JSON-Pruefung. */
Scanner.ocr = async function(dataUrl){
  const makeVariant = src => new Promise(resolve => { const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'), x=c.getContext('2d'); c.width=im.width;c.height=im.height;x.drawImage(im,0,0);const p=x.getImageData(0,0,c.width,c.height);for(let i=0;i<p.data.length;i+=4){const l=.299*p.data[i]+.587*p.data[i+1]+.114*p.data[i+2],v=l>155?255:l>80?120:0;p.data[i]=p.data[i+1]=p.data[i+2]=v;}x.putImageData(p,0,0);resolve(c.toDataURL('image/jpeg',.92));}; im.src=src; });
  const key=window.POCKIT_ANTHROPIC_API_KEY || '';
  if(!key) throw new Error('Für die automatische Erkennung fehlt der API-Schlüssel. Du kannst den Beleg trotzdem direkt prüfen und manuell erfassen.');
  const categories=DB.ka.map(k=>k.name).join(', '), variants=[dataUrl,await makeVariant(dataUrl)]; let lastError;
  for(const image of variants){ try { const response=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:900,temperature:0,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:image.split(',')[1]}},{type:'text',text:`Lies diesen Kassenbon sorgfältig. Antworte nur als JSON: {"haendler":string,"betrag":number,"datum":"YYYY-MM-DD","kategorie":string,"notiz":string}. Nutze als Betrag ausschliesslich den Gesamtbetrag (Total/Summe), kein Zwischentotal. Kategorie muss eine von ${categories} sein. Bei Unsicherheit null.`}]}]})}); if(!response.ok) throw new Error('Erkennung nicht verfügbar'); const out=await response.json(),raw=(out.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('').replace(/```json|```/g,'');const m=raw.match(/\{[\s\S]*\}/);if(!m) throw new Error('Kein lesbares Ergebnis');const j=JSON.parse(m[0]), match=DB.ka.find(k=>k.name.toLowerCase()===String(j.kategorie||'').toLowerCase());if(Number(j.betrag)>0) return {haendler:j.haendler||'',betrag:Number(j.betrag),datum:/^\d{4}-\d{2}-\d{2}$/.test(j.datum||'')?j.datum:today(),kategorie:match?match.id:'k11',notiz:j.notiz||''}; throw new Error('Gesamtbetrag nicht erkannt'); } catch(e){lastError=e;} }
  throw lastError || new Error('Beleg konnte nicht gelesen werden');
};
function katChips(aktiv, id, ausschluss){
  const liste = ausschluss ? DB.ka.filter(k => !ausschluss.includes(k.id)) : DB.ka;
  return `<div class="chips" id="${id}" data-value="${aktiv||''}">${liste.map(k => `
    <button type="button" class="chip ${k.id===aktiv?'on':''}" data-id="${k.id}" onclick="pickChip('${id}','${k.id}')">
      <span style="color:${k.id===aktiv?'#fff':k.farbe}">${I(k.icon_name)}</span>${esc(k.name)}</button>`).join('')}</div>`;
}
function tagChips(aktive, id){
  return `<div class="chips" id="${id}" data-multi="1" data-value="${(aktive||[]).join('|')}">${TAGS.map(t => `
    <button type="button" class="chip ${aktive && aktive.includes(t)?'on':''}" data-id="${t}"
      onclick="toggleChip('${id}','${t}')">${esc(t)}</button>`).join('')}</div>`;
}
function pickChip(gruppe, wert){
  const g = document.getElementById(gruppe); if(!g) return;
  g.dataset.value = wert;
  g.querySelectorAll('.chip').forEach(c => {
    const an = c.dataset.id === wert;
    c.classList.toggle('on', an);
    const s = c.querySelector('span'); const k = DB.ka.find(x => x.id === c.dataset.id);
    if(s && k) s.style.color = an ? '#fff' : k.farbe;
  });
}
function toggleChip(gruppe, wert){
  const g = document.getElementById(gruppe); if(!g) return;
  const set = new Set((g.dataset.value||'').split('|').filter(Boolean));
  set.has(wert) ? set.delete(wert) : set.add(wert);
  g.dataset.value = [...set].join('|');
  g.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', set.has(c.dataset.id)));
}
const sel      = id => (document.getElementById(id)||{}).dataset ? document.getElementById(id).dataset.value : '';
const selMulti = id => { const g = document.getElementById(id); return g && g.dataset.value ? g.dataset.value.split('|') : []; };

    sheet('Favoriten bearbeiten', `
      <div class="stack">${DB.fa.map(f => `
        <div class="row">${katIC(f.kategorie)}

  favLoeschen(id){ DB.fa = DB.fa.filter(f => f.id !== id); save('fa'); Modals.favoritenVerwalten(); },

  /* 7. Sparbetrag */
  sparen(){
    const opts = [...Array(12)].map((_,i) => { const d = new Date(); d.setMonth(d.getMonth()-i);
      return `<option value="${ymKey(d)}">${MONATE[d.getMonth()]} ${d.getFullYear()}</option>`; }).join('');
    sheet('Sparbetrag hinzufügen', `
      <div class="card compact" style="margin-bottom:var(--s3)">
        <label class="kpi-label" for="sBetrag">Betrag</label>
        <input class="input amount-input" id="sBetrag" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      </div>
      <div class="field"><label for="sMonat">Monat</label><select class="input" id="sMonat">${opts}</select></div>
      <div class="field"><label for="sZeit">Uhrzeit</label><input class="input" id="sZeit" type="time" value="${nowTime()}"></div>
      <div class="field"><label for="sNotiz">Notiz</label>
        <textarea class="input" id="sNotiz" placeholder="Wofür legst du zurück?"></textarea></div>
      <button class="btn" onclick="Modals.sparenSpeichern()">Sparbetrag speichern</button>`, { focus:'#sBetrag' });
  },
  sparenSpeichern(){
    const betrag = parseFloat($('#sBetrag').value);
    if(!betrag || betrag <= 0){ toast('Bitte einen Betrag eintragen','warn'); return; }
    DB.sp.push({ id:uid(), betrag, monat:$('#sMonat').value, zeit:$('#sZeit').value || undefined, notiz:$('#sNotiz').value.trim() || undefined, hinzugefuegt_am:today() });
    save('sp'); closeSheet(); render(); toast('Sparbetrag gespeichert');
  },

  /* 8. Abo */
  sparDetail(id){
    const s=DB.sp.find(x=>x.id===id); if(!s)return;
    sheet('Sparbetrag', `<div class="card" style="text-align:center"><div class="kpi-label">${esc(s.monat)}</div><div class="kpi-value lg" style="color:var(--success)">${eur(s.betrag)}</div><div class="tiny muted" style="margin-top:8px">${dLang(s.hinzugefuegt_am)}</div></div>${s.notiz?`<div class="card compact" style="margin-top:12px">${esc(s.notiz)}</div>`:''}<button class="btn danger" style="margin-top:var(--s3)" onclick="Modals.sparLoeschen('${s.id}')">${I('trash')} Löschen</button>`);
  },
  sparLoeschen(id){ confirmSheet('Sparbetrag löschen','Dieser Eintrag wird dauerhaft entfernt.','Löschen',()=>{DB.sp=DB.sp.filter(x=>x.id!==id);save('sp');closeSheet();render();toast('Sparbetrag gelöscht');}); },
  abo(bearbeiten){
    const a = bearbeiten ? DB.ab.find(x => x.id === bearbeiten) : null;
    sheet(a ? 'Abo bearbeiten' : 'Abo hinzufügen', `
      <div class="field"><label for="aName">Name</label>
        <input class="input" id="aName" value="${esc(a?a.name:'')}" placeholder="z. B. Spotify"></div>
      <div class="field"><label for="aBetrag">Betrag</label>
        <input class="input" id="aBetrag" type="number" step="0.01" inputmode="decimal" value="${a?a.betrag:''}" placeholder="0.00"></div>
      <div class="field"><label>Frequenz</label>
        <div class="seg" id="aFreq" data-value="${a?a.frequenz:'monatlich'}">
          <button type="button" class="${!a||a.frequenz==='monatlich'?'on':''}" onclick="pickSeg('aFreq','monatlich',this)">Monatlich</button>
          <button type="button" class="${a&&a.frequenz==='jaehrlich'?'on':''}" onclick="pickSeg('aFreq','jaehrlich',this)">Jährlich</button>
        </div></div>
      <div class="field"><label for="aStart">Startdatum</label>
        <input class="input" id="aStart" type="date" value="${a?a.startdatum:today()}"></div>
      <div class="field"><label>Kategorie</label>${katChips(a?a.kategorie:'k10','aKat')}</div>
      <div class="field"><label for="aFrist">Kündigungsfrist in Tagen</label>
        <input class="input" id="aFrist" type="number" inputmode="numeric" value="${a&&a.kuendigungsfrist?a.kuendigungsfrist:''}" placeholder="Optional, z. B. 30"></div>
      <div class="field"><label for="aZahl">Zahlungsart</label>
        <input class="input" id="aZahl" value="${esc(a&&a.zahlungsart?a.zahlungsart:'')}" placeholder="Optional, z. B. Kreditkarte"></div>
      <div class="field"><label for="aNotiz">Notiz</label>
        <textarea class="input" id="aNotiz" placeholder="Optional">${esc(a&&a.notiz?a.notiz:'')}</textarea></div>
      <button class="btn" onclick="Modals.aboSpeichern(${a?`'${a.id}'`:'null'})">${a?'Änderungen speichern':'Abo speichern'}</button>`);
  },
  aboSpeichern(id){
    const name = $('#aName').value.trim(), betrag = parseFloat($('#aBetrag').value);
    if(!name || !betrag){ toast('Name und Betrag angeben','warn'); return; }
    const daten = { name, betrag, frequenz:sel('aFreq')||'monatlich', startdatum:$('#aStart').value||today(),
      kategorie:sel('aKat')||'k10', kuendigungsfrist:parseInt($('#aFrist').value)||undefined,
      zahlungsart:$('#aZahl').value.trim()||undefined, notiz:$('#aNotiz').value.trim()||undefined, aktiv:true };
    if(id){ Object.assign(DB.ab.find(x => x.id === id), daten); }
    else { DB.ab.push(Object.assign({ id:uid() }, daten)); }
    save('ab'); Abos.synchronisieren(); closeSheet(); render();
    toast(id ? 'Abo aktualisiert' : 'Abo gespeichert');
  },
  aboDetail(id){
    const a = DB.ab.find(x => x.id === id); if(!a) return;
    const next = Calc.naechsteZahlung(a), frist = a.kuendigungsfrist ? bisHeute(next) - a.kuendigungsfrist : null;
    sheet(a.name, `
      <div class="card" style="display:flex;align-items:center;gap:14px">
        ${katIC(a.kategorie)}
        <div style="flex:1"><div class="kpi-label">${a.frequenz==='monatlich'?'Monatlich':'Jährlich'}</div>
          <div class="kpi-value sm">${eur(a.betrag)}</div></div>
        <div style="text-align:right"><div class="kpi-label">Nächste Zahlung</div>
          <div class="title">${dKurz(next)}</div></div>
      </div>
      ${frist !== null ? `<div class="alert" style="margin-top:var(--s2)">
        ${IC('clock', frist<=7?'#d64545':'#1a9b8e', 40)}
        <div class="txt"><b>${frist > 0 ? `Noch ${frist} Tage, um zu kündigen` : 'Kündigungsfrist verstrichen'}</b>
        <span>Frist: ${a.kuendigungsfrist} Tage vor Verlängerung</span></div></div>` : ''}
      ${a.zahlungsart ? `<div class="alert" style="margin-top:var(--s2)">${IC('wallet','#3b82f6',40)}
        <div class="txt"><b>${esc(a.zahlungsart)}</b><span>Zahlungsart</span></div></div>` : ''}
      ${a.notiz ? `<div class="card compact" style="margin-top:var(--s2)"><div class="kpi-label">Notiz</div>
        <p class="body" style="margin:6px 0 0">${esc(a.notiz)}</p></div>` : ''}
      <div class="btn-row" style="margin-top:var(--s4)">
        <button class="btn ghost" onclick="Modals.abo('${a.id}')">${I('edit')} Bearbeiten</button>
        <button class="btn soft" onclick="Modals.aboPause('${a.id}')">${a.aktiv!==false?'Pausieren':'Fortsetzen'}</button></div>
      <button class="btn danger" style="margin-top:var(--s2)" onclick="Modals.aboLoeschen('${a.id}')">${I('trash')} Abo löschen</button>`);
  },
  aboPause(id){ const a = DB.ab.find(x => x.id === id); a.aktiv = a.aktiv===false; save('ab'); closeSheet(); render();
    toast(a.aktiv ? 'Abo läuft weiter' : 'Abo pausiert'); },
  aboLoeschen(id){ confirmSheet('Abo löschen','Das Abo und seine künftigen Buchungen werden entfernt. Bereits erfasste Zahlungen bleiben bestehen.',
    'Löschen', () => { DB.ab = DB.ab.filter(x => x.id !== id); save('ab'); render(); toast('Abo gelöscht'); }); },

  /* 9c. Eigenes Kalender-Ereignis */
  ereignis(vorgabeDatum, bearbeitenId){
    const e = bearbeitenId ? DB.ev.find(x => x.id === bearbeitenId) : null;
    sheet(e ? 'Ereignis bearbeiten' : 'Ereignis hinzufügen', `
      <div class="field"><label for="evTitel">Titel</label>
        <input class="input" id="evTitel" value="${esc(e?e.titel:'')}" placeholder="z. B. Zahnarzttermin"></div>
      <div class="field"><label for="evText">Text</label>
        <textarea class="input" id="evText" placeholder="Optional">${esc(e&&e.text?e.text:'')}</textarea></div>
      <div class="field"><label for="evDatum">Datum</label>
        <input class="input" id="evDatum" type="date" value="${e?e.datum:(vorgabeDatum||today())}"></div>
      <div class="field"><label>Farbe</label><div class="chips" id="evFarbe" data-value="${e?e.farbe:FARB_PALETTE[5]}">${FARB_PALETTE.map(c => `
        <button type="button" class="chip ${(e?e.farbe:FARB_PALETTE[5])===c?'on':''}" data-id="${c}" onclick="pickEvFarbe('${c}')" style="width:38px;padding:0">
          <span style="display:block;width:18px;height:18px;border-radius:50%;background:${c}"></span></button>`).join('')}</div></div>

      { focus:'#evTitel' });
  },
  ereignisSpeichern(id){
    const titel = $('#evTitel').value.trim();
    if(!titel){ toast('Bitte einen Titel angeben','warn'); return; }
    const daten = { titel, text:$('#evText').value.trim()||undefined, datum:$('#evDatum').value||today(), farbe:sel('evFarbe')||FARB_PALETTE[5] };
    if(id){ Object.assign(DB.ev.find(x => x.id === id), daten); }
    else { DB.ev.push(Object.assign({ id:uid() }, daten)); }
    save('ev'); closeSheet(); calState.sel = daten.datum; calState.ym = ymKey(parse(daten.datum)); render();
    toast(id ? 'Ereignis aktualisiert' : 'Ereignis gespeichert');
  },
  ereignisLoeschen(id){ confirmSheet('Ereignis löschen','Dieser Eintrag wird dauerhaft entfernt.','Löschen',
    () => { DB.ev = DB.ev.filter(x => x.id !== id); save('ev'); closeSheet(); render(); toast('Ereignis gelöscht'); }); },

  /* 9. Garantie */
  garantie(bearbeiten){
    const g = bearbeiten ? DB.ga.find(x => x.id === bearbeiten) : null;
    sheet(g ? 'Garantie bearbeiten' : 'Garantie hinzufügen', `
      <div class="field"><label for="gName">Produkt</label>
        <input class="input" id="gName" value="${esc(g?g.produktname:'')}" placeholder="z. B. MacBook Air"></div>
      <div class="field"><label for="gHaendler">Händler</label>
        <input class="input" id="gHaendler" value="${esc(g?g.haendler:'')}" placeholder="z. B. Interdiscount"></div>
      <div class="field"><label for="gKauf">Kaufdatum</label>
        <input class="input" id="gKauf" type="date" value="${g?g.kaufdatum:today()}" onchange="Modals.garFrist()"></div>
      <div class="field"><label>Garantiedauer</label>
        <div class="chips">${[12,24,36,60].map(m => `<button type="button" class="chip" onclick="Modals.garSetzen(${m})">${m} Monate</button>`).join('')}</div></div>
      <div class="field"><label for="gEnde">Garantie endet am</label>
        <input class="input" id="gEnde" type="date" value="${g?g.garantie_enddatum:''}"></div>
      <div class="field"><label>Kategorie</label>${katChips(g?g.kategorie:'k3','gKat')}</div>
      <div class="field"><label for="gSerie">Seriennummer</label>
        <input class="input" id="gSerie" value="${esc(g&&g.seriennummer?g.seriennummer:'')}" placeholder="Optional"></div>
      <div class="field"><label for="gNotiz">Notiz</label>
        <textarea class="input" id="gNotiz" placeholder="Optional">${esc(g&&g.notiz?g.notiz:'')}</textarea></div>
      <button class="btn" onclick="Modals.garSpeichern(${g?`'${g.id}'`:'null'})">${g?'Änderungen speichern':'Garantie speichern'}</button>`);
    if(!g) Modals.garSetzen(24);
  },
  garSetzen(monate){
    const k = parse($('#gKauf').value || today()); k.setMonth(k.getMonth() + monate);
    $('#gEnde').value = iso(k);
  },
  garFrist(){ /* Kaufdatum geändert – Enddatum bleibt bestehen, kann neu gesetzt werden */ },
  garSpeichern(id){
    const produktname = $('#gName').value.trim();
    if(!produktname){ toast('Bitte Produktnamen angeben','warn'); return; }
    const daten = { produktname, haendler:$('#gHaendler').value.trim(), kaufdatum:$('#gKauf').value || today(),
      garantie_enddatum:$('#gEnde').value || today(), kategorie:sel('gKat')||'k3',
      seriennummer:$('#gSerie').value.trim()||undefined, notiz:$('#gNotiz').value.trim()||undefined };
    if(id) Object.assign(DB.ga.find(x => x.id === id), daten);
    else DB.ga.push(Object.assign({ id:uid() }, daten));
    save('ga'); closeSheet(); render(); toast(id ? 'Garantie aktualisiert' : 'Garantie gespeichert');
  },
  garDetail(id){
    const g = DB.ga.find(x => x.id === id); if(!g) return;
    const tage = bisHeute(g.garantie_enddatum);
    const gesamt = Math.max(1, dTage(g.garantie_enddatum, g.kaufdatum));
    const farbe = tage < 0 ? '#6b7280' : tage <= 30 ? '#d64545' : tage <= 90 ? '#ff9500' : '#2d9d78';
    sheet(g.produktname, `
      <div class="card" style="display:flex;align-items:center;gap:16px">
        ${Chart.gauge(Math.max(0,Math.min(100,tage/gesamt*100)), farbe, tage<0?'abgelaufen':'Tage übrig', tage<0?'–':String(tage), 104, 10)}
        <div style="flex:1">
          <div class="kpi-label">Garantie bis</div>
          <div class="title" style="font-size:17px;margin-top:2px">${dLang(g.garantie_enddatum)}</div>
          <div class="tiny muted" style="margin-top:8px">Gekauft am ${dLang(g.kaufdatum)}</div>
        </div>
      </div>
      <div class="stack" style="margin-top:var(--s2)">
        ${g.haendler ? `<div class="alert">${IC('bag','#1a9b8e',40)}<div class="txt"><b>${esc(g.haendler)}</b><span>Händler</span></div></div>` : ''}
        ${g.seriennummer ? `<div class="alert">${IC('tag','#8b5cf6',40)}<div class="txt"><b>${esc(g.seriennummer)}</b><span>Seriennummer</span></div></div>` : ''}
        ${g.notiz ? `<div class="alert">${IC('file','#6b7280',40)}<div class="txt"><b>Notiz</b><span>${esc(g.notiz)}</span></div></div>` : ''}
      </div>
      <div class="btn-row" style="margin-top:var(--s4)">
        <button class="btn ghost" onclick="Modals.garantie('${g.id}')">${I('edit')} Bearbeiten</button>
        <button class="btn danger" onclick="Modals.garLoeschen('${g.id}')">${I('trash')} Löschen</button></div>`);
  },
  garLoeschen(id){ confirmSheet('Garantie löschen','Der Eintrag wird dauerhaft entfernt.','Löschen',
    () => { DB.ga = DB.ga.filter(x => x.id !== id); save('ga'); render(); toast('Garantie gelöscht'); }); },

  /* Transaktions-Detail */
  txDetail(id){

    const k = kat(t.kategorie);
    sheet(t.beschreibung || k.name, `
      <div class="card" style="text-align:center">
        <div class="kpi-label">${esc(k.name)}</div>
        <div class="kpi-value lg" style="margin-top:4px">${eur(t.betrag)}</div>
        <div class="tiny muted" style="margin-top:8px">${dLang(t.datum)} · ${
          ({scan:'Gescannt',manuell:'Manuell erfasst',csv:'CSV-Import',abo:'Abo',favorit:'Favorit'})[t.quelle] || 'Erfasst'}</div>
      </div>
      ${t.bon_foto ? `<img src="${t.bon_foto}" alt="Kassenbon" style="width:100%;border-radius:16px;margin-top:12px;box-shadow:var(--sh-1)">` : ''}
      ${(t.tags||[]).length ? `<div class="chips" style="margin-top:12px">${t.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
      ${t.notiz ? `<div class="card compact" style="margin-top:12px"><div class="kpi-label">Notiz</div>
        <p class="body" style="margin:6px 0 0">${esc(t.notiz)}</p></div>` : ''}

  },
  txBearbeiten(id){
    const t = DB.tx.find(x => x.id === id);
    sheet('Zahlung bearbeiten', `
      <div class="card compact" style="margin-bottom:var(--s3)">
        <label class="kpi-label" for="eBetrag">Betrag</label>
        <input class="input amount-input" id="eBetrag" type="number" step="0.01" inputmode="decimal" value="${t.betrag}">
      </div>
      <div class="field"><label for="eBeschr">Beschreibung</label>
        <input class="input" id="eBeschr" value="${esc(t.beschreibung||'')}"></div>
      <div class="field" style="display:flex;gap:12px">
        <div style="flex:1"><label for="eDatum">Datum</label><input class="input" id="eDatum" type="date" value="${t.datum}"></div>
        <div style="flex:1"><label for="eZeit">Uhrzeit</label><input class="input" id="eZeit" type="time" value="${t.zeit||''}"></div>
      </div>
      <div class="field"><label>Kategorie</label>${katChips(t.kategorie,'eKat')}</div>
      <div class="field"><label>Tags</label>${tagChips(t.tags||[],'eTags')}</div>
      <div class="field"><label for="eNotiz">Notiz</label><textarea class="input" id="eNotiz">${esc(t.notiz||'')}</textarea></div>
      <button class="btn" onclick="Modals.txSpeichern('${t.id}')">Änderungen speichern</button>`);
  },
  txSpeichern(id){

    t.kategorie = sel('eKat') || t.kategorie;
    t.tags = selMulti('eTags');
    t.notiz = $('#eNotiz').value.trim() || undefined;
    save('tx'); closeSheet(); render(); toast('Zahlung aktualisiert');
  },
  txLoeschen(id){ confirmSheet('Zahlung löschen','Die Buchung wird dauerhaft entfernt.','Löschen',
    () => { DB.tx = DB.tx.filter(x => x.id !== id); save('tx'); render(); toast('Zahlung gelöscht'); }); },

  /* 12. Budget */
  budget(kid){
    const k = kat(kid);
    const b = DB.bu.find(x => x.kategorie === kid);
    sheet('Budget für ' + k.name, `
      <div class="card compact" style="margin-bottom:var(--s3);display:flex;align-items:center;gap:12px">
        ${IC(k.icon_name, k.farbe, 40)}
        <div style="flex:1"><div class="kpi-label">Monatslimit</div>
          <input class="input amount-input" id="buLimit" type="number" step="1" inputmode="decimal"
            style="text-align:left;padding:4px 0" value="${b?b.limit_betrag:''}" placeholder="0"></div>
      </div>
      <p class="tiny muted" style="margin:0 0 20px">Pockit meldet sich, sobald 80 Prozent erreicht sind.</p>
      <button class="btn" onclick="Modals.budgetSpeichern('${kid}')">Limit speichern</button>`, { focus:'#buLimit' });
  },
  budgetSpeichern(kid){

const Data = {
  addTx(tx){
    DB.tx.push(tx); save('tx');

  csvExport(){
    const rows = [['Datum','Beschreibung','Kategorie','Betrag','Quelle','Notiz'].join(',')];
    DB.tx.forEach(t => rows.push([t.datum, csvSafe(t.beschreibung), csvSafe(kat(t.kategorie).name),
      t.betrag, t.quelle, csvSafe(t.notiz||'')].join(',')));
    downloadFile('pockit_export_' + today() + '.csv', rows.join('\n'), 'text/csv');

  csvLesen(file){
    if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      const zeilen = r.result.split(/\r?\n/).filter(Boolean);
      const trenn = zeilen[0].includes(';') ? ';' : ',';
      const kopf = zeilen[0].toLowerCase().split(trenn).map(s => s.trim());
      const iD = kopf.findIndex(h => h.includes('datum')), iB = kopf.findIndex(h => h.includes('beschr') || h.includes('text') || h.includes('name'));
      const iA = kopf.findIndex(h => h.includes('betrag') || h.includes('amount'));
      window.__csvRows = zeilen.slice(1).map(z => {
        const c = z.split(trenn);
        const betrag = parseFloat((c[iA]||'0').replace(',','.').replace(/[^\d.-]/g,''));
        let datum = (c[iD]||today()).trim();
        if(/^\d{2}\.\d{2}\.\d{4}$/.test(datum)){ const [d,m,y] = datum.split('.'); datum = `${y}-${m}-${d}`; }
        return { datum: /^\d{4}-\d{2}-\d{2}$/.test(datum) ? datum : today(), beschreibung:(c[iB]||'Import').trim(), betrag:Math.abs(betrag)||0, kategorie:'k11' };
      }).filter(x => x.betrag > 0);
      $('#csvVorschau').innerHTML = window.__csvRows.length ? `
        <div class="tiny muted" style="margin-bottom:10px">${window.__csvRows.length} Zeilen erkannt · Kategorie zuordnen</div>

        <button class="btn" style="margin-top:var(--s3)" onclick="Data.csvUebernehmen()">${I('check')} ${window.__csvRows.length} Buchungen übernehmen</button>`
        : `<div class="card">${empty('file','Keine Zeilen erkannt','Prüfe, ob die Datei Spalten für Datum, Beschreibung und Betrag enthält.')}</div>`;
    };

    (window.__csvRows||[]).forEach(row => DB.tx.push({ id:uid(), betrag:row.betrag, kategorie:row.kategorie,

function csvSafe(s){ s = String(s??''); return /[,"\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function downloadFile(name, content, type){
  const blob = new Blob([content], { type });

}

/* ---------- 8. Abos automatisch als wiederkehrende Transaktionen übernehmen ---------- */
const Abos = {
  synchronisieren(){
    const heute = today();
    DB.ab.filter(a => a.aktiv!==false).forEach(a => {
      let d = new Date(parse(a.startdatum)); let guard = 0;
      while(iso(d) <= heute && guard < 600){
        const key = a.id + '_' + iso(d);
        if(!DB.tx.some(t => t.aboRef === key)){
          DB.tx.push({ id:uid(), betrag:+a.betrag, kategorie:a.kategorie, beschreibung:a.name,
            datum:iso(d), quelle:'abo', aboRef:key });
        }
        if(a.frequenz==='monatlich') d.setMonth(d.getMonth()+1); else d.setFullYear(d.getFullYear()+1);
        guard++;
      }
    });
    save('tx');
  }
};

   ============================================================ */
const Reviews = {
  pruefen(){
    const n = new Date();
    if(n.getDay() === 1 && n.getHours() >= 8 && DB.se.letzte_weekly !== iso(montag(n))) this.erzeugeWeekly();
    if(n.getDate() === 1 && n.getHours() >= 8 && DB.se.letzte_monthly !== ymKey(n)) this.erzeugeMonthly();
  },
  erzeugeWeekly(){
    const n = new Date();
    const start = iso(new Date(montag(n).getTime() - 7*864e5)), ende = iso(new Date(montag(n).getTime() - 864e5));
    const vStart = iso(new Date(montag(n).getTime() - 14*864e5)), vEnde = iso(new Date(montag(n).getTime() - 8*864e5));
    const r = bauReview('weekly', start, ende, vStart, vEnde, `KW ${kw(parse(start))}`);
    DB.rv.push(r); DB.se.letzte_weekly = iso(montag(n)); save('rv'); save('se');
    if(DB.se.push_reviews) toast('Dein Wochenreport ist bereit', 'info');
  },
  erzeugeMonthly(){
    const n = new Date();
    const vor = new Date(n.getFullYear(), n.getMonth()-1, 1);
    const start = iso(vor), ende = iso(new Date(n.getFullYear(), n.getMonth(), 0));
    const vv = new Date(n.getFullYear(), n.getMonth()-2, 1);
    const vStart = iso(vv), vEnde = iso(new Date(n.getFullYear(), n.getMonth()-1, 0));
    const r = bauReview('monthly', start, ende, vStart, vEnde, MONATE[vor.getMonth()] + ' ' + vor.getFullYear());
    r.wochen = wochenSplit(start, ende);
    DB.rv.push(r); DB.se.letzte_monthly = ymKey(n); save('rv'); save('se');
    if(DB.se.push_reviews) toast('Dein Monatsreport ist bereit', 'info');
  }
};
function kw(d){ const t = new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(),0,4); return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7); }
function bauReview(typ, start, ende, vStart, vEnde, zeitraum){
  const list = Calc.txIn(start, ende), vList = Calc.txIn(vStart, vEnde);
  const ausgegeben = Calc.summe(list), vAusgegeben = Calc.summe(vList);
  const gespart = DB.sp.filter(s => s.hinzugefuegt_am >= start && s.hinzugefuegt_am <= ende).reduce((a,s) => a+ +s.betrag,0);
  return {
    id:uid(), typ, zeitraum, ausgegeben_gesamt:ausgegeben, gespart_gesamt:gespart,
    ausgaben_nach_kategorie:Calc.nachKategorie(list).map(d => ({ id:d.id, betrag:d.betrag })),
    vergleich_vorperiode:Calc.trend(vAusgegeben, ausgegeben),
    top_3_ausgaben:[...list].sort((a,b) => b.betrag-a.betrag).slice(0,3),
    erstellt_am:today(), angesehen:false
  };
}
function wochenSplit(start, ende){
  const weeks = []; let d = parse(start);
  while(iso(d) <= ende){
    const wEnde = new Date(Math.min(new Date(d.getTime()+6*864e5), parse(ende)));
    weeks.push({ label:'KW ' + kw(d), wert:Calc.summe(Calc.txIn(iso(d), iso(wEnde))) });
    d = new Date(d.getTime() + 7*864e5);
  }
  return weeks;
}

        <div class="pr-kpi"><div class="l">Ausgegeben</div><div class="v">${eur0(r.ausgegeben_gesamt)}</div></div>

        <div class="pr-kpi"><div class="l">vs. Vorperiode</div><div class="v">${(r.vergleich_vorperiode>=0?'+':'')+r.vergleich_vorperiode.toFixed(0)}%</div></div>
      </div>
      <h2>Wo dein Geld hinging</h2>
      ${kats.map(d => `<div class="pr-row">
          <span class="pr-dot" style="background:${d.k.farbe}"></span>
          <span class="pr-name">${esc(d.k.name)}</span>
          <span class="pr-bar-bg"><span class="pr-bar-fg" style="width:${(d.betrag/max*100).toFixed(1)}%;background:${d.k.farbe}"></span></span>
          <span class="pr-amt">${eur(d.betrag)}</span>
        </div>`).join('') || '<div class="pr-sub">Keine Ausgaben erfasst.</div>'}
      <h2>Top 3 Ausgaben</h2>
      ${(r.top_3_ausgaben||[]).map(t => `<div class="pr-txrow"><span>${dKurz(t.datum)} · ${esc(kat(t.kategorie).name)} · ${esc(t.beschreibung||'')}</span><span>${eur(t.betrag)}</span></div>`).join('')
        || '<div class="pr-sub">Keine Ausgaben.</div>'}
      <div class="pr-foot">Pockit</div>`;
  },
  teilen(id){
    const r = DB.rv.find(x => x.id === id); if(!r) return;
    const text = `Pockit ${r.typ==='weekly'?'Wochenreport':'Monatsreport'} – ${r.zeitraum}: ${eur0(r.ausgegeben_gesamt)} ausgegeben, ${eur0(r.gespart_gesamt)} gespart.`;
    if(navigator.share) navigator.share({ title:'Pockit Report', text }).catch(()=>{});
    else { navigator.clipboard && navigator.clipboard.writeText(text); toast('In Zwischenablage kopiert'); }
  }
};

/* ============================================================
   12) BENACHRICHTIGUNGEN
   ============================================================ */
const Push = {
  async anfordern(){
    if(!('Notification' in window)){ toast('Benachrichtigungen werden von diesem Browser nicht unterstützt','warn'); return; }
    const p = await Notification.requestPermission();
    if(p === 'granted') toast('Benachrichtigungen aktiviert');
    else toast('Benachrichtigungen wurden nicht erlaubt','warn');
  },
  send(titel, body){
    if('Notification' in window && Notification.permission === 'granted') new Notification(titel, { body, icon:'/icon.png' });
  },
  taeglichPruefen(){
    if(DB.se.push_garantie) DB.ga.forEach(g => { if(bisHeute(g.garantie_enddatum) === 7) this.send('Garantie läuft in 7 Tagen ab', g.produktname); });
    if(DB.se.push_abo) DB.ab.filter(a=>a.aktiv!==false).forEach(a => { if(bisHeute(Calc.naechsteZahlung(a)) === 0) this.send(a.name + ' wird heute abgebucht', eur(a.betrag)); });
  }
};

/* PWA: Web-App-Manifest & Icon dynamisch als Data-URI einbinden (single-file Deployment) */
(function pwaSetup(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1729"/><stop offset="1" stop-color="#1a9b8e"/></linearGradient></defs>
    <rect width="192" height="192" rx="42" fill="url(#bg)"/>
    <circle cx="96" cy="96" r="52" fill="none" stroke="#fff" stroke-width="9"/>
    <path d="M84 78a24 24 0 0 1 34-8M84 114a24 24 0 0 0 34 8" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 68h20M78 92h20" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <path d="M118 128l14-16 8 8 12-17" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  const iconUri = 'icon-512.png';
  const link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = iconUri;
  document.head.appendChild(link);
  const link2 = document.createElement('link'); link2.rel = 'icon'; link2.href = iconUri;
  document.head.appendChild(link2);

  const manifest = {
    name:'Pockit', short_name:'Pockit', start_url:'.', display:'standalone',
    background_color:'#f7f8fa', theme_color:'#1a9b8e',
    icons:[{ src:iconUri, sizes:'192x192', type:'image/svg+xml' }]
  };
  const mLink = document.createElement('link'); mLink.rel = 'manifest';
  mLink.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(mLink);
})();

/* App starten – erst Konto-/Sperr-Gates prüfen, dann eigentliche App starten. */
function startApp(){
  seedDemo();
  Abos.synchronisieren();
  reportsSicherstellen();
  go('home');
  setTimeout(() => document.getElementById('splash').classList.add('out'), 600);
  setInterval(() => { Abos.synchronisieren(); Reviews.pruefen(); Push.taeglichPruefen(); if(route.tab==='home') render(); }, 6e4);
}
(async function boot(){
  if(!Auth.session){
    document.getElementById('splash').classList.add('out');
    document.getElementById('authGate').classList.add('show');
    return;
  }
  const fresh = await Auth.refresh();
  if(!fresh){
    Auth.signOut();
    document.getElementById('splash').classList.add('out');
    document.getElementById('authGate').classList.add('show');
    return;
  }
  if(sessionStorage.getItem('pockit_unlocked')==='1'){
    await Cloud.pullAll();
    document.getElementById('splash').classList.add('out');
    startApp();
    return;
  }
  document.getElementById('splash').classList.add('out');
  AuthUI.showLockGate();
})();
