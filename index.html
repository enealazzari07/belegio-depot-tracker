<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Pockit</title>
<meta name="description" content="Pockit – Garantie- & Ausgaben-Manager mit Kassenbon-Scanner">
<meta name="theme-color" content="#1a9b8e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pockit">
<link rel="apple-touch-icon" sizes="180x180" href="icon-512.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   POCKIT – DESIGN-SYSTEM
   Farbpalette, Spacing (8px-Grid), Typografie, Card-Stile
   ============================================================ */
:root{
  /* Marke */
  --teal:#1a9b8e;
  --teal-600:#158377;
  --navy:#0f1729;
  --navy-2:#14213d;

  /* Flächen */
  --bg:#f7f8fa;
  --card:#ffffff;
  --card-2:#f2f4f7;
  --overlay:rgba(15,23,41,.55);

  /* Semantik */
  --success:#2d9d78;
  --warn:#ff9500;
  --crit:#d64545;

  /* Text */
  --tp:#1a1f2e;
  --ts:#6b7280;
  --tt:#9aa3af;

  /* Tiefe (keine Borders – Trennung über Schatten & Abstand) */
  --sh-1:0 2px 8px rgba(0,0,0,.06);
  --sh-2:0 6px 20px rgba(0,0,0,.08);
  --sh-hero:0 12px 28px rgba(15,23,41,.22);

  /* Radien */
  --r-hero:20px;
  --r-card:16px;
  --r-sm:12px;
  --r-pill:999px;

  /* 8px-Grid */
  --s1:8px; --s2:12px; --s3:16px; --s4:20px; --s5:24px; --s6:32px;

  --nav-h:64px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dark"]{
  --bg:#0d1117;
  --card:#161b22;
  --card-2:#1c2430;
  --tp:#f5f5f7;
  --ts:#8b949e;
  --tt:#6e7681;
  --sh-1:0 2px 8px rgba(0,0,0,.4);
  --sh-2:0 6px 20px rgba(0,0,0,.5);
  --sh-hero:0 12px 28px rgba(0,0,0,.5);
  --overlay:rgba(0,0,0,.66);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tp);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tp)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:0;height:0}

/* ---------- Layout ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
#view{
  padding:0 var(--s3) calc(var(--nav-h) + env(safe-area-inset-bottom) + 40px);
  animation:viewIn .28s var(--ease);
}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  padding:calc(env(safe-area-inset-top) + 18px) var(--s3) var(--s3);
  position:sticky;top:0;z-index:40;
  background:linear-gradient(var(--bg) 72%,transparent);
  backdrop-filter:saturate(180%) blur(12px);
}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.topbar .sub{font-size:12px;font-weight:500;color:var(--ts);letter-spacing:.02em;margin-top:2px}
.section{margin-top:var(--s5)}
.section+.section{margin-top:var(--s6)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s2)}
.section-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.section-link{font-size:13px;font-weight:600;color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:var(--s2)}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--s4)}
.card.compact{padding:var(--s3)}
.card.tap{transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.card.tap:active{transform:scale(.985) translateY(1px);box-shadow:var(--sh-2)}
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 45%,var(--teal) 140%);
  border-radius:var(--r-hero);padding:var(--s4);box-shadow:var(--sh-hero);
}
.hero::after{ /* weiche Lichtkante, kein harter Schlagschatten */
  content:"";position:absolute;inset:-40% -30% auto auto;width:180px;height:180px;
  background:radial-gradient(circle,rgba(26,155,142,.45),transparent 68%);
}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);align-items:stretch}

/* ---------- Typografie-Hierarchie ---------- */
.kpi-label{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--ts);text-transform:none}
.hero .kpi-label{color:rgba(255,255,255,.72)}
.kpi-value{font-size:32px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpi-value.lg{font-size:38px}
.kpi-value.sm{font-size:26px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ts)}
.tiny{font-size:12px}
.title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.body{font-size:14px}

/* ---------- Trend-Chip ---------- */
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:4px 8px;border-radius:var(--r-pill);margin-top:10px;font-variant-numeric:tabular-nums}
.trend svg{width:13px;height:13px}
.hero .trend{background:rgba(255,255,255,.16);color:#fff}
.trend.up{background:rgba(214,69,69,.12);color:var(--crit)}
.trend.down{background:rgba(45,157,120,.12);color:var(--success)}
.trend.flat{background:rgba(107,114,128,.12);color:var(--ts)}

/* ---------- Icon-Container (immer Kreis) ---------- */
.ico{display:grid;place-items:center;border-radius:50%;flex:0 0 auto}
.ico-40{width:40px;height:40px}
.ico-36{width:36px;height:36px}
.ico-32{width:32px;height:32px}
.ico svg{width:20px;height:20px;stroke-width:1.8}
.ico-32 svg{width:17px;height:17px}
svg.lc{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Listenzeilen ---------- */
.row{display:flex;align-items:center;gap:var(--s2);background:var(--card);
  border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--s3);
  transition:transform .12s var(--ease)}
.row:active{transform:scale(.985)}
.row-main{flex:1;min-width:0}
.row-name{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--ts);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-amt.pos{color:var(--success)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--card-2);color:var(--ts);letter-spacing:.02em}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:600;padding:14px 20px;border-radius:14px;min-height:48px;
  background:var(--teal);color:#fff;transition:transform .12s var(--ease),opacity .12s var(--ease);width:100%}
.btn:active{transform:scale(.97);opacity:.88}
.btn.ghost{background:var(--card);color:var(--tp);box-shadow:var(--sh-1)}
.btn.soft{background:rgba(26,155,142,.12);color:var(--teal)}
.btn.danger{background:rgba(214,69,69,.12);color:var(--crit)}
.btn.dark{background:var(--navy)}
.btn svg{width:19px;height:19px}
.btn-row{display:flex;gap:var(--s2)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
  background:var(--card);box-shadow:var(--sh-1);transition:transform .12s var(--ease)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

/* Quick-Add */
.quick{display:grid;grid-template-columns:1fr 1.28fr 1fr;gap:var(--s2);align-items:end}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);
  border-radius:var(--r-card);box-shadow:var(--sh-1);padding:14px 8px;
  transition:transform .12s var(--ease),opacity .12s var(--ease)}
.qa:active{transform:scale(.97);opacity:.9}
.qa span{font-size:12px;font-weight:600}
.qa.scan{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:20px 8px;
  box-shadow:0 10px 24px rgba(26,155,142,.32)}
.qa.scan .ico{width:48px;height:48px;background:rgba(255,255,255,.18);color:#fff}
.qa.scan .ico svg{width:24px;height:24px}

/* ---------- Formulare ---------- */
.field{margin-bottom:var(--s3)}
.field label{display:block;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--ts);margin-bottom:6px}
.input{width:100%;background:var(--card-2);border-radius:12px;padding:13px 14px;border:0;
  font-size:15px;font-weight:500;min-height:48px;appearance:none}
.input:focus{outline:2px solid var(--teal);outline-offset:0}
textarea.input{min-height:76px;resize:vertical;line-height:1.5}
.amount-input{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  text-align:center;padding:18px 14px;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:var(--r-pill);
  background:var(--card-2);font-size:13px;font-weight:600;min-height:38px;transition:transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--teal);color:#fff}
.chip svg{width:15px;height:15px}
.seg{display:flex;background:var(--card-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ts);transition:.14s var(--ease)}
.seg button.on{background:var(--card);color:var(--tp);box-shadow:var(--sh-1)}
html[data-theme="dark"] .seg button.on{background:var(--teal);color:#fff}
.switch{width:50px;height:30px;border-radius:var(--r-pill);background:var(--card-2);position:relative;flex:0 0 auto;transition:.2s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s var(--ease)}
.switch.on{background:var(--teal)}
.switch.on::after{transform:translateX(20px)}

/* ---------- Modal / Sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:80;opacity:0;
  animation:fade .2s var(--ease) forwards;backdrop-filter:blur(3px)}
@keyframes fade{to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:520px;margin:0 auto;
  background:var(--bg);border-radius:24px 24px 0 0;padding:var(--s3) var(--s3) calc(env(safe-area-inset-bottom) + 20px);
  max-height:92vh;overflow-y:auto;animation:up .3s var(--ease);box-shadow:0 -8px 32px rgba(0,0,0,.18)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:40px;height:4px;border-radius:999px;background:var(--card-2);margin:4px auto var(--s3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.sheet-head h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;z-index:120;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--tp);
  box-shadow:var(--sh-2);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;
  max-width:calc(100% - 32px);animation:toastIn .26s var(--ease)}
.toast .ico{width:26px;height:26px}
.toast .ico svg{width:15px;height:15px}
.toast.out{animation:toastOut .24s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.97)}}

/* ---------- Skeletons statt Spinner ---------- */
.sk{background:linear-gradient(90deg,var(--card-2) 25%,rgba(255,255,255,.35) 50%,var(--card-2) 75%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px}
html[data-theme="dark"] .sk{background:linear-gradient(90deg,#1c2430 25%,#2a3441 50%,#1c2430 75%);background-size:200% 100%}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Bottom-Navigation ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:saturate(180%) blur(18px);box-shadow:0 -1px 16px rgba(0,0,0,.07)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tt);
  font-size:10px;font-weight:600;padding:6px 0;min-height:44px;transition:color .16s var(--ease)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--teal)}
.quick-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.quick-actions .icon-btn{width:40px;height:40px}
.swipe-kpi{touch-action:pan-y;user-select:none;display:flex;flex-direction:column;justify-content:space-between;
  min-height:132px;box-sizing:border-box}
.swipe-kpi .kpi-label{min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.date-group{font-size:12px;font-weight:700;color:var(--ts);margin:14px 2px 6px}
.period-rail{display:flex;gap:5px;margin-top:16px;align-items:center}.period-rail i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.2);flex:1;transition:background-color .35s ease,opacity .35s ease}.period-rail i.on{background:rgba(255,255,255,.82)}
.chart-wrap{position:relative;padding-top:28px}.chart-tip{position:absolute;top:0;right:6px;pointer-events:none;z-index:2;background:var(--navy);color:#fff;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:var(--sh-2)}
.chart-wrap .chart-cross{stroke:var(--ts);stroke-width:1;stroke-dasharray:4 3;pointer-events:none}
.chart-wrap .chart-dot{pointer-events:none}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(145deg,#061326,#0b2542);transition:opacity .42s ease,visibility .42s ease}#splash.out{opacity:0;visibility:hidden}.splash-inner{text-align:center;color:#fff;animation:splashIn .7s cubic-bezier(.22,.61,.36,1)}.splash-inner img{width:112px;height:112px;border-radius:27px;box-shadow:0 18px 46px rgba(0,0,0,.36);display:block;margin:0 auto 18px}.splash-inner strong{font-size:28px;letter-spacing:.12em;font-weight:500}.splash-load{width:86px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:20px auto 0;overflow:hidden}.splash-load i{display:block;width:48%;height:100%;background:#9ae6c7;border-radius:4px;animation:load 1.1s ease-in-out infinite}@keyframes splashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(230%)}}

/* ---------- Scanner (Vollbild) ---------- */
#scanner{position:fixed;inset:0;z-index:100;background:#05070c;display:none;flex-direction:column}
#scanner.on{display:flex}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-top{position:relative;z-index:2;display:flex;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) var(--s3) 0}
.scan-top .icon-btn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;backdrop-filter:blur(8px)}
.scan-top .icon-btn.on{background:var(--warn);color:#fff}
.scan-frame{position:relative;z-index:2;flex:1;display:grid;place-items:center}
.frame{width:76vw;max-width:330px;aspect-ratio:1/1.12;position:relative}
.frame i{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.95}
#rotateLock{display:none;position:fixed;inset:0;z-index:999;background:#061326;color:#fff;text-align:center;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
@media (orientation:landscape) and (max-width:926px){#rotateLock{display:flex}#app,#nav,#modal,#toasts,#splash{display:none !important}}
#rotateLock svg{width:52px;height:52px;stroke:#9ae6c7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#authGate,#lockGate{display:none;position:fixed;inset:0;z-index:300;background:linear-gradient(145deg,#061326,#0b2542);
  color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
#authGate.show,#lockGate.show{display:block}
.gate-wrap{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 22px 40px}
.gate-wrap img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 18px}
.gate-wrap h1{font-size:22px;text-align:center;margin:0 0 6px}
.gate-wrap .gate-sub{font-size:13px;text-align:center;color:rgba(255,255,255,.65);margin-bottom:28px}
.gate-wrap .field{margin-bottom:14px}
.gate-wrap label{font-size:12px;color:rgba(255,255,255,.7);display:block;margin-bottom:6px}
.gate-wrap .input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:13px 14px;color:#fff;font-size:15px}
.gate-wrap .seg{display:flex;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px;margin-bottom:14px}
.gate-wrap .seg button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.gate-wrap .seg button.on{background:#1a9b8e;color:#fff}
.gate-wrap .btn{width:100%;padding:14px;border-radius:12px;background:#1a9b8e;color:#fff;font-weight:700;font-size:15px;margin-top:6px}
.gate-wrap .btn.ghost{background:rgba(255,255,255,.08)}
.gate-wrap .gate-err{font-size:12px;color:#ff8080;margin-top:10px;text-align:center;min-height:16px}
.gate-wrap .gate-switch{font-size:13px;text-align:center;margin-top:20px;color:rgba(255,255,255,.6)}
.gate-wrap .gate-switch b{color:#7ee2c1;font-weight:600;cursor:pointer}
.lock-face{width:88px;height:88px;border-radius:50%;background:rgba(26,155,142,.16);display:grid;place-items:center;margin:0 auto 22px}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.frame .laser{position:absolute;left:6px;right:6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:laser 2.6s var(--ease) infinite}
@keyframes laser{0%,100%{top:8%}50%{top:92%}}
.scan-hint{position:relative;z-index:2;text-align:center;color:rgba(255,255,255,.82);font-size:13px;font-weight:500;padding:0 var(--s5)}
.scan-bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:var(--s5);
  padding:var(--s4) var(--s3) calc(env(safe-area-inset-bottom) + 28px)}
.shutter{width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.32);
  display:grid;place-items:center;transition:transform .12s var(--ease)}
.shutter:active{transform:scale(.92)}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #05070c}
.scan-side{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;

<script>
/* ============================================================
   1) SPEICHER  –  alle Daten bleiben lokal auf dem Gerät
   localStorage; fällt automatisch auf Arbeitsspeicher zurück,
   wenn der Browser-Speicher blockiert ist (z.B. Vorschau/Sandbox).
   ============================================================ */
const Store = (() => {
  let ok = false, mem = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    persistent: ok,
    get(k, fb){
      try { const r = ok ? localStorage.getItem(k) : mem[k]; return r ? JSON.parse(r) : fb; }
      catch(e){ return fb; }
    },
    set(k, v){
      const s = JSON.stringify(v);
      try { if(ok) localStorage.setItem(k, s); else mem[k] = s; } catch(e){ mem[k] = s; }
    },
    clear(){ try{ if(ok) Object.keys(KEYS).forEach(x => localStorage.removeItem(KEYS[x])); }catch(e){} mem = {}; }
  };
})();

const KEYS = {
  tx:'pockit.v2.transaktionen', sp:'pockit.v2.ersparnisse', ab:'pockit.v2.abos', ga:'pockit.v2.garantien',
  bu:'pockit.v2.budgets', ka:'pockit.v2.kategorien', fa:'pockit.v2.favoriten', rv:'pockit.v2.reviews', se:'pockit.v2.settings',
  ev:'pockit.v2.ereignisse'
};

/* Gemeinsame Farbpalette für Kategorien- und Ereignis-Auswahl */
const FARB_PALETTE = ['#1a9b8e','#2d9d78','#ff9500','#d64545','#3b82f6','#8b5cf6','#ec4899','#0ea5e9','#a855f7','#f59e0b','#64748b','#06b6d4','#84cc16','#f97316','#e11d48'];
/* Standard-Kategorien: Name, Icon, Farbe (Kreis-Container bekommt 14% Deckkraft) */
const DEFAULT_KATEGORIEN = [
  { id:'k1', name:'Lebensmittel', icon_name:'cart',    farbe:'#2d9d78' },
  { id:'k2', name:'Restaurant',   icon_name:'utensils',farbe:'#ff9500' },
  { id:'k3', name:'Elektronik',   icon_name:'monitor', farbe:'#3b82f6' },
  { id:'k4', name:'Mobilität',    icon_name:'car',     farbe:'#0ea5e9' },
  { id:'k5', name:'Wohnen',       icon_name:'home',    farbe:'#8b5cf6' },
  { id:'k6', name:'Reisen',       icon_name:'plane',   farbe:'#a855f7' },
  { id:'k7', name:'Gesundheit',   icon_name:'pulse',   farbe:'#ef4444' },
  { id:'k8', name:'Freizeit',     icon_name:'film',    farbe:'#ec4899' },
  { id:'k9', name:'Kleidung',     icon_name:'shirt',   farbe:'#14b8a6' },
  { id:'k10',name:'Abos',         icon_name:'repeat',  farbe:'#f59e0b' },
  { id:'k11',name:'Sonstiges',    icon_name:'dots',    farbe:'#6b7280' }
];
const DEFAULT_FAVORITEN = [
  { id:'f1', name:'Kaffee',      betrag:4.50,  kategorie:'k2',  einkaufsladen:'Café' },
  { id:'f2', name:'Tankstelle',  betrag:65.00, kategorie:'k4',  einkaufsladen:'Tankstelle' },
  { id:'f3', name:'Supermarkt',  betrag:35.00, kategorie:'k1',  einkaufsladen:'Supermarkt' },
  { id:'f4', name:'Mittagessen', betrag:14.50, kategorie:'k2',  einkaufsladen:'Kantine' }
];
const DEFAULT_SETTINGS = {
  name:'Mein Konto', waehrung:'EUR', theme:'dark',
  push_reviews:true, push_garantie:true, push_budget:true, push_abo:true,
  anomalie:true, letzte_weekly:null, letzte_monthly:null
};
const TAGS = ['Für mich','Geschenk','Notwendigkeit','Luxus'];

/* Zentraler App-Zustand */
const DB = {
  tx:  Store.get(KEYS.tx, []),
  sp:  Store.get(KEYS.sp, []),
  ab:  Store.get(KEYS.ab, []),
  ga:  Store.get(KEYS.ga, []),
  bu:  Store.get(KEYS.bu, []),
  ka:  Store.get(KEYS.ka, DEFAULT_KATEGORIEN),
  fa:  Store.get(KEYS.fa, DEFAULT_FAVORITEN),
  rv:  Store.get(KEYS.rv, []),
  se:  Object.assign({}, DEFAULT_SETTINGS, Store.get(KEYS.se, {})),
  ev:  Store.get(KEYS.ev, [])
};
const save = k => { Store.set(KEYS[k], DB[k]); Cloud.push(k, DB[k]); };
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============================================================
   1b) KONTO & CLOUD-SYNC (Supabase)
   E-Mail/Passwort-Konto + zentrale Datenbank für alle Geräte/Konten.
   Lokaler Speicher (Store, oben) bleibt als Offline-Cache bestehen;
   bei aktiver Sitzung wird zusätzlich mit Supabase synchronisiert.
   ============================================================ */
const SB_URL = 'https://gfpuoejemjnqphvhpgbo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmcHVvZWplbWpucXBodmhwZ2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTU1OTMsImV4cCI6MjEwMjI5MTU5M30.jYJDsGQRwSyKIHF6hfQFqKIttSaqOoh_cRItBdoNy7g';
const SESSION_KEY = 'pockit.v2.session';
const LOCKCFG_KEY = 'pockit.v2.lockcfg'; /* {mode:'passkey'|'password', pwHash?, credId?} – rein lokal, gerätespezifisch */

const Auth = {
  session: Store.get(SESSION_KEY, null),
  async signUp(email, password){
    const r = await fetch(`${SB_URL}/auth/v1/signup`, { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SB_KEY }, body: JSON.stringify({ email, password }) });
    const d = await r.json();
    if(!r.ok) throw new Error(d.msg || d.error_description || d.error || 'Registrierung fehlgeschlagen');
    if(d.access_token) Auth.setSession(d);
    return d;
  },
  async signIn(email, password){
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SB_KEY }, body: JSON.stringify({ email, password }) });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || 'E-Mail oder Passwort falsch');
    Auth.setSession(d);
    return d;
  },
  setSession(d){
    Auth.session = { access_token:d.access_token, refresh_token:d.refresh_token, user:d.user };
    Store.set(SESSION_KEY, Auth.session);
  },
  async refresh(){
    if(!Auth.session) return false;
    try{
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST',
        headers:{ 'Content-Type':'application/json', apikey:SB_KEY }, body: JSON.stringify({ refresh_token: Auth.session.refresh_token }) });
      if(!r.ok) return false;
      const d = await r.json(); Auth.setSession(d); return true;
    }catch(e){ return false; }
  },
  signOut(){ Auth.session = null; Store.set(SESSION_KEY, null); Store.set(LOCKCFG_KEY, null); }
};

const Cloud = {
  /* Holt alle Collections des Kontos und spiegelt sie in DB + lokalen Cache. */
  async pullAll(){
    if(!Auth.session) return false;
    try{
      const r = await fetch(`${SB_URL}/rest/v1/pockit_store?select=store_key,value`, {
        headers:{ apikey:SB_KEY, Authorization:`Bearer ${Auth.session.access_token}` } });
      if(!r.ok) return false;
      const rows = await r.json();
      if(!rows.length) return true; /* neues Konto: nichts in der Cloud, lokale Defaults bleiben */
      rows.forEach(row => {
        if(!(row.store_key in KEYS)) return;
        DB[row.store_key] = row.store_key === 'se' ? Object.assign({}, DEFAULT_SETTINGS, row.value) : row.value;
        Store.set(KEYS[row.store_key], DB[row.store_key]);
      });
      return true;
    }catch(e){ return false; }
  },
  /* Schreibt eine Collection in die Cloud (fire-and-forget, blockiert die UI nicht). */
  async push(key, value){
    if(!Auth.session) return;
    try{
      await fetch(`${SB_URL}/rest/v1/pockit_store?on_conflict=user_id,store_key`, {
        method:'POST',
        headers:{ apikey:SB_KEY, Authorization:`Bearer ${Auth.session.access_token}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
        body: JSON.stringify([{ user_id: Auth.session.user.id, store_key:key, value, updated_at:new Date().toISOString() }])
      });
    }catch(e){ /* offline: lokaler Stand bleibt gültig, nächster save() versucht erneut */ }
  }
};

/* Geräte-Sperre: Face ID/Touch ID via WebAuthn-Passkey (biometrische Geräteprüfung)
   oder ein separates App-Passwort. Hinweis: Die Passkey-Prüfung läuft rein lokal
   im Browser (kein eigener Verifizierungs-Server) – sie bestätigt "dieses Gerät,
   biometrisch entsperrt", ersetzt aber keine serverseitige WebAuthn-Signaturprüfung. */
const Passkey = {
  supported(){ return !!(window.PublicKeyCredential && navigator.credentials); },
  async register(email){
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name:'Pockit' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: email, displayName: email },
      pubKeyCredParams: [{ alg:-7, type:'public-key' }, { alg:-257, type:'public-key' }],
      authenticatorSelection: { userVerification:'required', authenticatorAttachment:'platform' },
      timeout: 60000
    }});
    return cred.id; /* base64url */
  },
  async verify(credId){
    const raw = Uint8Array.from(atob(credId.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
    const assertion = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ id: raw, type:'public-key' }],
      userVerification:'required', timeout:60000
    }});
    return !!assertion;
  }
};
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const AuthUI = {
  mode:'register', lockMode:'passkey', busy:false,
  setMode(m){
    this.mode = m;
    $('#agTabReg').classList.toggle('on', m==='register'); $('#agTabLog').classList.toggle('on', m==='login');
    $('#agLockChoice').style.display = m==='register' ? '' : 'none';
    $('#agSubmit').textContent = m==='register' ? 'Konto erstellen' : 'Anmelden';
    $('#agSwitch').innerHTML = m==='register' ? 'Schon ein Konto? <b onclick="AuthUI.setMode(\'login\')">Anmelden</b>' : 'Noch kein Konto? <b onclick="AuthUI.setMode(\'register\')">Konto erstellen</b>';
    $('#agTitle').textContent = m==='register' ? 'Willkommen bei Pockit' : 'Willkommen zurück';
    $('#agErr').textContent = '';
  },
  setLockMode(m){
    this.lockMode = m;
    $('#agLockFace').classList.toggle('on', m==='passkey'); $('#agLockPw').classList.toggle('on', m==='password');
    $('#agAppPwField').style.display = m==='password' ? '' : 'none';
  },
  async submit(){
    if(this.busy) return;
    const email = $('#agEmail').value.trim(), pw = $('#agPw').value;
    const err = $('#agErr'); err.textContent = '';
    if(!email || !pw){ err.textContent = 'Bitte E-Mail und Passwort ausfüllen.'; return; }
    if(this.mode==='register' && pw.length < 8){ err.textContent = 'Passwort braucht mind. 8 Zeichen.'; return; }
    if(this.mode==='register' && this.lockMode==='password' && !$('#agAppPw').value){ err.textContent = 'Bitte ein App-Öffnen-Passwort festlegen.'; return; }
    if(!Passkey.supported() && this.mode==='register' && this.lockMode==='passkey'){ err.textContent = 'Face ID/Touch ID auf diesem Gerät nicht verfügbar – bitte Passwort wählen.'; return; }
    this.busy = true; $('#agSubmit').textContent = 'Bitte warten…';
    try{
      if(this.mode==='register'){
        const d = await Auth.signUp(email, pw);
        if(!d.access_token){ err.textContent = 'Konto erstellt – bitte bestätige deine E-Mail und melde dich dann an.'; this.setMode('login'); this.busy=false; return; }
        await this.setupLock(email);
        await Cloud.pullAll();
        this.finish();
      } else {
        await Auth.signIn(email, pw);
        const cfg = Store.get(LOCKCFG_KEY, null);
        if(!cfg) await this.setupLock(email); /* neues Gerät: Sperre hier einrichten */
        await Cloud.pullAll();
        this.finish();
      }
    }catch(e){ err.textContent = e.message || 'Etwas ist schiefgelaufen.'; }
    this.busy = false; $('#agSubmit').textContent = this.mode==='register' ? 'Konto erstellen' : 'Anmelden';
  },
  async setupLock(email){
    if(this.lockMode==='passkey' && Passkey.supported()){
      try{ const credId = await Passkey.register(email); Store.set(LOCKCFG_KEY, { mode:'passkey', credId }); return; }
      catch(e){ /* Nutzer hat Passkey-Dialog abgebrochen -> auf Passwort zurückfallen */ }
    }
    const pw = $('#agAppPw') && $('#agAppPw').value;
    const hash = await sha256Hex(pw || $('#agPw').value);
    Store.set(LOCKCFG_KEY, { mode:'password', pwHash:hash });
  },
  finish(){
    $('#authGate').classList.remove('show');
    sessionStorage.setItem('pockit_unlocked','1');
    startApp();
  },
  async tryPasskey(){
    const cfg = Store.get(LOCKCFG_KEY, null); const err = $('#lgErr'); err.textContent = '';
    try{ const ok = await Passkey.verify(cfg.credId); if(!ok) throw 0; this.unlocked(); }
    catch(e){ err.textContent = 'Nicht erkannt – bitte erneut versuchen.'; }
  },
  async tryPassword(){
    const cfg = Store.get(LOCKCFG_KEY, null); const err = $('#lgErr'); err.textContent = '';
    const hash = await sha256Hex($('#lgPw').value);
    if(hash === cfg.pwHash) this.unlocked(); else err.textContent = 'Falsches Passwort.';
  },
  async unlocked(){
    $('#lockGate').classList.remove('show');
    sessionStorage.setItem('pockit_unlocked','1');
    await Cloud.pullAll();
    startApp();
  },
  logout(){ Auth.signOut(); location.reload(); },
  async showLockGate(){
    const cfg = Store.get(LOCKCFG_KEY, null);
    $('#lgFaceBox').style.display = (cfg && cfg.mode==='passkey') ? '' : 'none';
    $('#lgPwBox').style.display = (cfg && cfg.mode==='password') ? '' : 'none';
    $('#lockGate').classList.add('show');
    if(cfg && cfg.mode==='passkey') this.tryPasskey(); /* direkt anstoßen, Nutzer kann bei Fehlschlag erneut tippen */
  }
};

/* ============================================================
   2) HILFSFUNKTIONEN – Datum, Format, Berechnungen
   ============================================================ */
const CUR = { EUR:'€', CHF:'CHF', USD:'$', GBP:'£' };
const cur = () => CUR[DB.se.waehrung] || '€';
const eur = (n, dec=2) => cur() + ' ' + (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const eur0 = n => cur() + ' ' + Math.round(Number(n)||0).toLocaleString('de-DE');
const pct = n => (n>0?'+':'') + n.toFixed(0) + '%';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON_K  = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DOW    = ['Mo','Di','Mi','Do','Fr','Sa','So'];

const iso   = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => iso(new Date());
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const ymKey = d => iso(new Date(d)).slice(0,7);
const parse = s => { const d = new Date(s + (String(s).length===10 ? 'T12:00:00' : '')); return isNaN(d) ? new Date() : d; };
const dTage = (a,b) => Math.round((parse(a) - parse(b)) / 864e5);
const bisHeute = d => dTage(d, today());
const dLang = s => { const d = parse(s); return d.getDate() + '. ' + MONATE[d.getMonth()] + ' ' + d.getFullYear(); };
const dKurz = s => { const d = parse(s); return String(d.getDate()).padStart(2,'0') + '. ' + MON_K[d.getMonth()]; };
const relTag = s => { const n = bisHeute(s); return n===0 ? 'Heute' : n===-1 ? 'Gestern' : n===1 ? 'Morgen' : dKurz(s); };
const montag = d => { const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; };

const kat  = id => DB.ka.find(k => k.id===id) || { id:'?', name:'Sonstiges', icon_name:'dots', farbe:'#6b7280' };
const tint = (hex, a=.14) => { const h = hex.replace('#',''); const n = parseInt(h,16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };

/* --- Berechnungen laut Spezifikation --- */
const Calc = {
  txIn: (von, bis) => DB.tx.filter(t => t.datum >= von && t.datum <= bis),
  summe: list => list.reduce((s,t) => s + (+t.betrag||0), 0),
  ausgabenZeitraum(von, bis){ return Calc.summe(Calc.txIn(von, bis)); },
  nachKategorie(list){
    const m = {}; list.forEach(t => m[t.kategorie] = (m[t.kategorie]||0) + (+t.betrag||0));
    return Object.entries(m).map(([id,betrag]) => ({ id, betrag, k:kat(id) })).sort((a,b) => b.betrag - a.betrag);
  },
  sparenMonat(ym){ return DB.sp.filter(s => s.monat===ym).reduce((a,s) => a + (+s.betrag||0), 0); },
  sparenGesamt(){ return DB.sp.reduce((a,s) => a + (+s.betrag||0), 0); },
  aboMonatlich(){ return DB.ab.filter(a => a.aktiv!==false).reduce((s,a) => s + (a.frequenz==='monatlich' ? +a.betrag : +a.betrag/12), 0); },
  aboJaehrlich(){ return Calc.aboMonatlich() * 12; },
  budgetStatus(kid, ym){
    const b = DB.bu.find(x => x.kategorie===kid && (!x.monat || x.monat===ym));
    if(!b) return null;
    const aus = DB.tx.filter(t => t.kategorie===kid && ymKey(t.datum)===ym).reduce((s,t) => s + (+t.betrag||0), 0);
    return { limit:+b.limit_betrag, aus, prozent: b.limit_betrag>0 ? (aus/b.limit_betrag)*100 : 0, id:b.id };
  },
  sparquote(ausgaben, sparen){ const g = ausgaben + sparen; return g>0 ? (sparen/g)*100 : 0; },
  trend(p1, p2){ if(!p1) return p2>0 ? 100 : 0; return ((p2-p1)/p1)*100; },
  /* Nächstes Fälligkeitsdatum eines Abos */
  naechsteZahlung(a){
    const start = parse(a.startdatum), n = new Date(); n.setHours(0,0,0,0);
    let d = new Date(start);
    if(a.frequenz==='monatlich'){ while(d < n){ d.setMonth(d.getMonth()+1); } }
    else { while(d < n){ d.setFullYear(d.getFullYear()+1); } }
    return iso(d);
  },
  /* Hochrechnung: Ausgaben bis Monatsende */
  vorhersage(){
    const n = new Date(), ym = ymKey(n), tag = n.getDate();
    const tageImMonat = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
    const bisher = Calc.summe(DB.tx.filter(t => ymKey(t.datum)===ym));
    return { bisher, prognose: tag>0 ? (bisher/tag)*tageImMonat : 0, tag, tageImMonat };
  },
  /* Anomalie: Betrag > 2,5× Median der Kategorie (min. 4 Vergleichswerte) */
  istAnomalie(betrag, kid){
    if(!DB.se.anomalie) return false;
    const w = DB.tx.filter(t => t.kategorie===kid).map(t => +t.betrag).sort((a,b) => a-b);
    if(w.length < 4) return false;
    const med = w[Math.floor(w.length/2)];
    return betrag > med * 2.5 && betrag > 30;
  },
  /* Sparstreak: aufeinanderfolgende Monate mit Sparbetrag */
  sparstreak(){
    let s = 0, d = new Date();
    for(let i=0;i<36;i++){ const ym = ymKey(d); if(Calc.sparenMonat(ym) > 0) s++; else if(i>0) break; d.setMonth(d.getMonth()-1); }
    return s;
  }
};

let routeHistory = [];

function go(tab, param=null, remember=true, scrollY=0){
  if(tab === 'scan'){ Scanner.open(); return; }
  if(remember && (route.tab!==tab || route.param!==param)) routeHistory.push({ ...route, scroll: window.scrollY });
  route = { tab, param };
  render();
  requestAnimationFrame(() => window.scrollTo({ top:scrollY, behavior:'instant' in window ? 'instant' : 'auto' }));
}

function renderNav(){
  el.nav.innerHTML = TABS.map(t =>
    `<button class="${route.tab===t.id?'on':''}" onclick="go('${t.id}')" aria-current="${route.tab===t.id?'page':'false'}">
         ${I(t.icon)}<span>${t.label}</span></button>`
  ).join('');
}

/* Toast – dezent, von oben, 2 Sekunden */
function toast(text, art='ok'){
  const map = { ok:['checkCircle','var(--success)'], warn:['alert','var(--warn)'], err:['alert','var(--crit)'], info:['bell','var(--teal)'] };
  const [ic, col] = map[art] || map.ok;
  const n = document.createElement('div');
  n.className = 'toast';
  n.innerHTML = `<span class="ico ico-32" style="background:${col.startsWith('var')?'rgba(26,155,142,.14)':col};color:${col}">${I(ic)}</span><span>${esc(text)}</span>`;
  el.toasts.appendChild(n);
  setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 240); }, 2000);
}

/* Bottom-Sheet / Modal */
function sheet(title, html, opts={}){
  const drag = 'onpointerdown="SheetSwipe.start(event)" onpointermove="SheetSwipe.move(event)" onpointerup="SheetSwipe.end(event)" onpointercancel="SheetSwipe.cancel(event)"';
  el.modal.innerHTML = `
    <div class="scrim" onclick="closeSheet()"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grabber" ${drag}></div>
      <div class="sheet-head" ${drag}><h2>${esc(title)}</h2>
        <button class="icon-btn" onclick="closeSheet()" aria-label="Schließen">${I('x')}</button></div>
      ${html}
    </section>`;
  document.body.style.overflow = 'hidden';
  if(opts.focus) setTimeout(() => { const f = $(opts.focus); if(f) f.focus(); }, 320);
}
function closeSheet(){ el.modal.innerHTML = ''; document.body.style.overflow = ''; }

/* Pop-outs per Runterwischen (am Griff/Titel) schliessen, zusaetzlich zum X-Button */
const SheetSwipe = {
  el:null, y0:null, dragging:false,
  start(e){
    this.el = document.querySelector('.sheet');
    if(!this.el) return;
    this.y0 = e.clientY;
    this.dragging = true;
    this.el.style.transition = 'none';
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  },
  move(e){
    if(!this.dragging || this.y0==null || !this.el) return;
    const dy = e.clientY - this.y0;
    if(dy > 0) this.el.style.transform = `translateY(${dy}px)`;
  },
  end(e){
    if(!this.dragging || this.y0==null || !this.el) { this.cancel(e); return; }
    const dy = e.clientY - this.y0;
    this.dragging = false; this.y0 = null;
    this.el.style.transition = '';
    if(dy > 90){
      this.el.style.transform = 'translateY(100%)';
      setTimeout(closeSheet, 160);
    } else {
      this.el.style.transform = '';
    }
    this.el = null;
  },
  cancel(){
    this.dragging = false; this.y0 = null;
    if(this.el){ this.el.style.transition = ''; this.el.style.transform = ''; }
    this.el = null;
  }
};

/* Bestätigungsdialog */
function confirmSheet(title, text, label, fn, gefahr=true){
  window.__confirm = () => { closeSheet(); fn(); };
  sheet(title, `
    <p class="body muted" style="margin:0 0 20px">${esc(text)}</p>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeSheet()">Abbrechen</button>
      <button class="btn ${gefahr?'danger':''}" onclick="__confirm()">${esc(label)}</button>
    </div>`);
}

    const p = Math.max(0, Math.min(100, prozent));
    const r = (size - dick) / 2, c = 2 * Math.PI * r, off = c * (1 - p/100);
    const id = 'g' + uid();
    return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;overflow:visible" role="img" aria-label="${esc(label)} ${p.toFixed(0)}%">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${farbe}"/><stop offset="100%" stop-color="${farbe}" stop-opacity=".62"/>
      </linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${tint(farbe,.16)}" stroke-width="${dick}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${dick}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .7s cubic-bezier(.22,.61,.36,1)"/>
      <text x="50%" y="47%" text-anchor="middle" fill="currentColor" font-size="${size/5.6}" font-weight="700"
        style="font-variant-numeric:tabular-nums;letter-spacing:-.02em">${wert}</text>
      <text x="50%" y="63%" text-anchor="middle" fill="var(--ts)" font-size="${size/12}" font-weight="500">${esc(label)}</text>
    </svg>`;
  },

  /* Balken mit abgerundeten Enden und Verlauf */
  bars(data, opts={}){
    if(!data.length) return '';
    const max = Math.max(...data.map(d => d.wert)) || 1;
    return `<div class="stack" style="gap:14px">` + data.map(d => `
      <div style="display:flex;align-items:center;gap:12px">
        ${d.icon ? IC(d.icon, d.farbe, 36) : ''}
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px">
            <span class="title" style="font-size:14px">${esc(d.name)}</span>
            <span class="num" style="font-size:14px;font-weight:700">${eur(d.wert)}</span>
          </div>
          <div class="progress"><i style="width:${(d.wert/max*100).toFixed(1)}%;
            background:linear-gradient(90deg,${d.farbe},${tint(d.farbe,.55)})"></i></div>
        </div>
      </div>`).join('') + `</div>`;
  },

  /* Vertikale Balken (z.B. Wochen im Monatsreport) */
  vbars(data, farbe='#1a9b8e', h=120){
    const max = Math.max(...data.map(d => d.wert), 1);
    return `<div style="display:flex;align-items:flex-end;gap:10px;height:${h}px;padding-top:8px">` +
      data.map(d => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end">
        <span class="tiny num" style="font-weight:700">${Math.round(d.wert)}</span>
        <div style="width:100%;height:${Math.max(4,(d.wert/max)*(h-46))}px;border-radius:8px;
          background:linear-gradient(180deg,${farbe},${tint(farbe,.45)})"></div>
        <span class="tiny muted">${esc(d.label)}</span>
      </div>`).join('') + `</div>`;
  },

  /* Line-Chart: weiche Bezier-Kurve + Flächen-Fade */
  line(werte, labels, farbe='#1a9b8e', h=150){
    const w = 320, pad = 8;
    const max = Math.max(...werte, 1), min = 0;
    const pts = werte.map((v,i) => [ pad + i*((w-2*pad)/Math.max(1,werte.length-1)),
                                     h - 22 - ((v-min)/(max-min||1))*(h-40) ]);
    let d = '';
    pts.forEach((p,i) => {
      if(!i) { d += `M${p[0]},${p[1]}`; return; }
      const q = pts[i-1], cx = (q[0]+p[0])/2;
      d += ` C${cx},${q[1]} ${cx},${p[1]} ${p[0]},${p[1]}`;
    });
    const id = 'l' + uid();
    const chartId='chart'+uid();
    const move = `Chart.tip(event,'${chartId}',${JSON.stringify(werte).replace(/"/g,'&quot;')},${JSON.stringify(labels).replace(/"/g,'&quot;')},${w},${h},${pad})`;
    return `<div class="chart-wrap" id="${chartId}"><div class="chart-tip" hidden></div><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;touch-action:none" role="img" aria-label="Verlauf"
      onpointermove="${move}" onpointerdown="${move}"
      onpointerleave="Chart.hideTip('${chartId}')" onpointerup="Chart.hideTip('${chartId}')" onpointercancel="Chart.hideTip('${chartId}')">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${farbe}" stop-opacity=".34"/>
        <stop offset="100%" stop-color="${farbe}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${pts[pts.length-1][0]},${h-22} L${pts[0][0]},${h-22} Z" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${farbe}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i) => i===pts.length-1
        ? `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${farbe}" stroke="var(--card)" stroke-width="2.5"/>` : '').join('')}
      ${labels.map((l,i) => i % Math.ceil(labels.length/6) === 0
        ? `<text x="${pts[i][0]}" y="${h-6}" text-anchor="middle" fill="var(--ts)" font-size="10" font-weight="500">${esc(l)}</text>` : '').join('')}
      <line class="chart-cross" x1="${pad}" y1="0" x2="${pad}" y2="${h-22}" hidden/>
      <circle class="chart-dot" r="4.5" fill="${farbe}" stroke="var(--card)" stroke-width="2.5" hidden/>
    </svg></div>`;
  },

  /* Donut/Pie mit Legende */
  donut(data, size=168){
    const total = data.reduce((s,d) => s + d.wert, 0);
    if(!total) return `<div class="empty"><p>Noch keine Daten für diesen Zeitraum</p></div>`;
    const r = size/2 - 14, c = 2*Math.PI*r;
    let acc = 0;
    const ringe = data.map(d => {
      const frac = d.wert/total, seg = `${(c*frac-2.5).toFixed(2)} ${(c-c*frac+2.5).toFixed(2)}`;
      const rot = acc*360 - 90; acc += frac;
      return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${d.farbe}" stroke-width="20"
        stroke-dasharray="${seg}" transform="rotate(${rot} ${size/2} ${size/2})" stroke-linecap="butt"/>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;align-items:center">
      <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px" role="img" aria-label="Kategorienverteilung">
        ${ringe}
        <text x="50%" y="48%" text-anchor="middle" fill="currentColor" font-size="22" font-weight="700"
          style="font-variant-numeric:tabular-nums;letter-spacing:-.02em">${eur0(total)}</text>
        <text x="50%" y="60%" text-anchor="middle" fill="var(--ts)" font-size="11" font-weight="500">gesamt</text>
      </svg>
      <div class="legend">${data.map(d => `<div><i style="background:${d.farbe}"></i>${esc(d.name)}
        <span class="num" style="color:var(--tp);font-weight:600">${eur(d.wert)} · ${(d.wert/total*100).toFixed(0)}%</span></div>`).join('')}</div>
    </div>`;
  }
};
/* Fadenkreuz folgt der Berührung in x (vertikale Linie), das Label bleibt fix oben in der Box (nicht am Finger). */
Chart.tip=(event,id,values,labels,w,h,pad)=>{
  const box=document.getElementById(id); if(!box) return;
  const tip=box.querySelector('.chart-tip'), svg=box.querySelector('svg'),
    cross=svg.querySelector('.chart-cross'), dot=svg.querySelector('.chart-dot');
  const r=svg.getBoundingClientRect();
  const idx=Math.max(0,Math.min(values.length-1,Math.round((event.clientX-r.left)/r.width*(values.length-1))));
  const max=Math.max(...values,1), min=0;
  const x = pad + idx*((w-2*pad)/Math.max(1,values.length-1));
  const y = h - 22 - ((values[idx]-min)/(max-min||1))*(h-40);
  cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.removeAttribute('hidden');
  dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.removeAttribute('hidden');
  tip.hidden=false;
  tip.textContent=`${labels[idx]} · ${eur(values[idx])}`;
};
Chart.hideTip=id=>{
  const box=document.getElementById(id); if(!box) return;
  const tip=box.querySelector('.chart-tip'); if(tip) tip.hidden=true;
  const cross=box.querySelector('.chart-cross'); if(cross) cross.setAttribute('hidden','');
  const dot=box.querySelector('.chart-dot'); if(dot) dot.setAttribute('hidden','');
};

/* Trend-Chip erzeugen (Pfeilrichtung + Prozent) */
function trendChip(prozentwert, invers=false, aufHero=false){
  const p = prozentwert;
  const richtung = Math.abs(p) < 0.5 ? 'flat' : (p > 0 ? 'up' : 'down');
  const gut = invers ? p > 0 : p < 0;
  const cls = aufHero ? '' : (richtung==='flat' ? 'flat' : (gut ? 'down' : 'up'));
  const ic = richtung === 'flat' ? 'minus' : (p > 0 ? 'up' : 'down');
  return `<span class="trend ${cls}">${I(ic)} ${richtung==='flat' ? 'stabil' : pct(p)} vs. Vorwoche</span>`;
}

}

/* Warnungen-Sektion */
function warnungen(){
  const list = [];
  DB.ga.filter(g => { const t = bisHeute(g.garantie_enddatum); return t >= 0 && t <= 30; })
    .sort((a,b) => a.garantie_enddatum.localeCompare(b.garantie_enddatum))
    .forEach(g => list.push({ ic:'shield', col:'var(--crit)', hex:'#d64545',
      t:`Garantie läuft ab: ${g.produktname}`, s:`Noch ${bisHeute(g.garantie_enddatum)} Tage · bis ${dKurz(g.garantie_enddatum)}`, fn:`go('gar')` }));

  const ym = ymKey(new Date());
  DB.bu.forEach(b => { const st = Calc.budgetStatus(b.kategorie, ym);
    if(st && st.prozent >= 100) list.push({ ic:'target', col:'var(--crit)', hex:'#d64545',
      t:`Budget überschritten: ${kat(b.kategorie).name}`, s:`${eur(st.aus)} von ${eur(st.limit)} · ${st.prozent.toFixed(0)}%`, fn:`go('budget')` });
    else if(st && st.prozent >= 80) list.push({ ic:'target', col:'var(--warn)', hex:'#ff9500',
      t:`Budget fast erreicht: ${kat(b.kategorie).name}`, s:`Noch ${eur(st.limit - st.aus)} übrig`, fn:`go('budget')` });
  });

  DB.ab.filter(a => a.aktiv).forEach(a => { const t = bisHeute(Calc.naechsteZahlung(a));
    if(t >= 0 && t <= 7) list.push({ ic:'repeat', col:'var(--warn)', hex:'#ff9500',
      t:`${a.name} wird abgebucht`, s:`${eur(a.betrag)} · ${t===0?'heute':'in ' + t + ' Tagen'}`, fn:`go('abos')` }); });

  if(!list.length) return '';
  return `<section class="section">

      <span class="badge">${list.length}</span></div>

/* Insights-Sektion */
function insights(wocheAus, vorAus){
  const v = Calc.vorhersage();
  const streak = Calc.sparstreak();
  const diff = wocheAus - vorAus;
  const texte = [];
  if(vorAus > 0) texte.push({ ic:diff <= 0 ? 'down' : 'up', hex:diff <= 0 ? '#2d9d78' : '#ff9500',
    t: diff <= 0 ? `Du liegst ${eur(Math.abs(diff))} unter der Vorwoche` : `Du liegst ${eur(diff)} über der Vorwoche`,
    s: diff <= 0 ? 'Weiter so – das summiert sich übers Jahr.' : 'Noch ist Zeit, das Wochenende ruhiger zu gestalten.' });
  if(v.bisher > 0) texte.push({ ic:'spark', hex:'#1a9b8e',
    t:`Hochrechnung Monatsende: ${eur0(v.prognose)}`,
    s:`Basierend auf ${v.tag} von ${v.tageImMonat} Tagen.` });
  if(streak > 0) texte.push({ ic:'heart', hex:'#2d9d78',
    t:`${streak} ${streak===1?'Monat':'Monate'} Sparstreak`,
    s:'Jeder Monat mit Rücklage zählt.' });
  if(!texte.length) return '';
  return `<section class="section">
    <div class="section-head"><div class="section-title">Insights</div></div>
    <div class="stack">${texte.map(t => `<div class="alert">${IC(t.ic,t.hex,40)}

}

};
function setKatModus(m){ katFilter.modus = m; render(); }
function shiftMonat(n){
  const d = parse(katFilter.ym + '-01');
  if(katFilter.modus === 'jahr') d.setFullYear(d.getFullYear() + n); else d.setMonth(d.getMonth() + n);
  katFilter.ym = ymKey(d); render();
}

/* Zahlungen & Startseite: einheitliche Zeitraeume und kompakte Uebersichten */
const PERIOD_LABEL = {tag:'Heute', woche:'Diese Woche', monat:'Dieser Monat', jahr:'Dieses Jahr'};
const PERIOD_SUBLABEL = {tag:'Tag', woche:'Woche', monat:'Monat', jahr:'Jahr'};
function periodRange(modus, ref){
  const n = ref || new Date(); let von, bis;
  if(modus==='tag'){ von = new Date(n.getFullYear(),n.getMonth(),n.getDate()); bis = von; }
  else if(modus==='woche'){ von = montag(n); bis = new Date(von.getTime()+6*864e5); }
  else if(modus==='monat'){ von = new Date(n.getFullYear(),n.getMonth(),1); bis = new Date(n.getFullYear(),n.getMonth()+1,0); }
  else { von = new Date(n.getFullYear(),0,1); bis = new Date(n.getFullYear(),11,31); }
  let bisIso = iso(bis);
  if(bisIso > today()) bisIso = today();
  return [iso(von), bisIso];
}
/* Label für die Zeitraum-Navigation, z. B. "August 2026" oder "KW 33 · 10.–16. Aug" */
function periodNavLabel(modus, ref){
  if(modus==='tag') return dLang(iso(ref));
  if(modus==='woche'){ const von=montag(ref), bis=new Date(von.getTime()+6*864e5); return `KW ${kw(von)} · ${dKurz(iso(von))} – ${dKurz(iso(bis))}`; }
  if(modus==='monat') return MONATE[ref.getMonth()] + ' ' + ref.getFullYear();
  return String(ref.getFullYear());
}
/* Wiederverwendbare Zeitraum-Navigation (Pfeile + Titel), gleiches Design wie im Kalender. */
function periodNavHTML(modus, ref, prevFn, nextFn){
  return `<div class="card compact" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:var(--s2)">
    <button class="icon-btn" style="box-shadow:none;background:var(--card-2)" onclick="${prevFn}" aria-label="Vorheriger Zeitraum">${I('left')}</button>
    <div style="text-align:center;min-width:0">
      <div class="tiny muted">${PERIOD_SUBLABEL[modus] || ''}</div>
      <div class="title">${periodNavLabel(modus, ref)}</div>
    </div>
    <button class="icon-btn" style="box-shadow:none;background:var(--card-2)" onclick="${nextFn}" aria-label="Nächster Zeitraum">${I('right')}</button>
  </div>`;
}
function shiftRef(ref, modus, n){
  const d = new Date(ref);
  if(modus==='tag') d.setDate(d.getDate()+n);
  else if(modus==='woche') d.setDate(d.getDate()+7*n);
  else if(modus==='monat') d.setMonth(d.getMonth()+n);
  else d.setFullYear(d.getFullYear()+n);
  return d;
}
function txInPeriod(modus, ref){ const [von,bis] = periodRange(modus, ref); return Calc.txIn(von,bis).sort((a,b)=>b.datum.localeCompare(a.datum)); }
function txGroups(list){
  const groups = {}; list.forEach(t => (groups[t.datum] ||= []).push(t));
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(d => `<div class="date-group">${dLang(d)}</div><div class="stack">${groups[d].map(txRow).join('')}</div>`).join('');
}
let homePeriod = {aus:'woche', spar:'woche'};
const PERIOD_SEQ = ['tag','woche','monat'];
function railHTML(key){
  return `<div class="period-rail">${PERIOD_SEQ.map(p => `<i class="${homePeriod[key]===p?'on':''}"></i>`).join('')}</div>`;
}
function sparInPeriod(modus){
  const [von,bis] = periodRange(modus);
  return DB.sp.filter(s=>s.hinzugefuegt_am>=von&&s.hinzugefuegt_am<=bis).reduce((v,s)=>v+(+s.betrag||0),0);
}
const Swipe = {
  moved:false,
  start(e,key){ this.x=e.clientX; this.key=key; this.moved=false; },
  end(e){
    if(this.x==null) return;
    const d = e.clientX - this.x; this.x = null;
    if(Math.abs(d) < 35) return;
    this.moved = true;
    let i = PERIOD_SEQ.indexOf(homePeriod[this.key]);
    i = (i + (d<0?1:-1) + PERIOD_SEQ.length) % PERIOD_SEQ.length;
    homePeriod[this.key] = PERIOD_SEQ[i];
    Swipe.update(this.key);
  },
  /* Aktualisiert nur die betroffene Widget-Karte per DOM statt komplettem render(),
     damit die Balken-Umschaltung per CSS-Transition sichtbar animiert. */
  update(key){
    const card = document.getElementById('kpi-' + key);
    if(!card){ render(); return; }
    const label = card.querySelector('.kpi-label'), value = card.querySelector('.kpi-value');
    card.querySelectorAll('.period-rail i').forEach((el,ix) => el.classList.toggle('on', PERIOD_SEQ[ix]===homePeriod[key]));
    if(key === 'aus'){
      label.textContent = `Ausgaben · ${PERIOD_LABEL[homePeriod.aus]}`;
      value.textContent = eur0(Calc.summe(txInPeriod(homePeriod.aus)));
    } else {
      label.textContent = `Gespart · ${PERIOD_LABEL[homePeriod.spar]}`;
      value.textContent = eur0(sparInPeriod(homePeriod.spar));
    }
  }
};
VIEWS.home = () => {

    <button class="hero swipe-kpi" id="kpi-spar" onclick="if(!Swipe.moved)go('spar')" onpointerdown="Swipe.start(event,'spar')" onpointerup="Swipe.end(event)"><div class="kpi-label">Gespart · ${PERIOD_LABEL[homePeriod.spar]}</div><div class="kpi-value">${eur0(spar)}</div>${railHTML('spar')}</button>

  <div class="quick" style="margin-top:var(--s3)"><button class="qa" onclick="Modals.zahlung()">${IC('receipt','#1a9b8e',40)}<span>Zahlung</span></button><button class="qa scan" onclick="Scanner.open()"><span class="ico">${I('camera')}</span><span>Scannen</span></button><button class="qa" onclick="Modals.sparen()">${IC('heart','#2d9d78',40)}<span>Sparen</span></button></div>
  <section class="section"><div class="section-head"><div class="section-title">Letzte Transaktionen</div><button class="section-link" onclick="go('kat')">Alle</button></div>${last.length?`<div class="stack">${last.map(txRow).join('')}</div>`:`<div class="card">${empty('receipt','Noch keine Transaktionen','Scanne einen Beleg oder erfasse eine Zahlung. ',`<button class="btn" onclick="Scanner.open()">${I('camera')} Beleg scannen</button>`)}</div>`}</section>
  <section class="section"><div class="section-head"><div><div class="section-title">Ausgaben</div><div class="tiny muted" style="margin-top:2px">${PERIOD_LABEL.monat} · ${eur(Calc.summe(monat))}</div></div><button class="section-link" onclick="go('kat')">Details</button></div>${cats.length?`<div class="card">${Chart.bars(cats.map(x=>({name:x.k.name,wert:x.betrag,farbe:x.k.farbe,icon:x.k.icon_name})))}</div>`:`<div class="card">${empty('layers','Noch keine Ausgaben','Die Ausgaben nach Kategorien erscheinen hier automatisch.')}</div>`}</section>`;
};

let sparFilter = 'monat';
VIEWS.spar = () => { const list=DB.sp.filter(s=>{const [von,bis]=periodRange(sparFilter);return s.hinzugefuegt_am>=von&&s.hinzugefuegt_am<=bis;}).sort((a,b)=>b.hinzugefuegt_am.localeCompare(a.hinzugefuegt_am));const total=list.reduce((v,s)=>v+(+s.betrag||0),0);return `<div class="seg" style="margin-top:var(--s1)">${['tag','woche','monat','jahr'].map(p=>`<button class="${sparFilter===p?'on':''}" onclick="sparFilter='${p}';render()">${({tag:'Tag',woche:'Woche',monat:'Monat',jahr:'Jahr'})[p]}</button>`).join('')}</div><div class="hero" style="margin-top:var(--s3)"><div class="kpi-label">Gespart · ${PERIOD_LABEL[sparFilter]}</div><div class="kpi-value">${eur0(total)}</div></div><button class="btn" style="margin-top:var(--s3)" onclick="Modals.sparen()">${I('plus')} Sparbetrag hinzufügen</button><section class="section"><div class="section-head"><div class="section-title">Einträge</div></div>${list.length?`<div class="stack">${list.map(s=>`<button class="row" style="width:100%;text-align:left" onclick="Modals.sparDetail('${s.id}')">${IC('heart','#2d9d78',40)}<div class="row-main"><div class="row-name">${esc(s.notiz||'Rücklage')}</div><div class="row-sub">${dLang(s.hinzugefuegt_am)} · ${esc(s.monat)}</div></div><div class="row-amt" style="color:var(--success)">${eur(s.betrag)}</div></button>`).join('')}</div>`:`<div class="card">${empty('heart','Keine Ersparnisse','Füge deinen ersten Sparbetrag hinzu.')}</div>`}</section>`; };
let zahlungFilter = 'monat';
let zahlungRef = new Date();
let zahlungShowAll = false;
function setZahlungFilter(m){ zahlungFilter = m; zahlungRef = new Date(); zahlungShowAll = false; render(); }
function shiftZahlung(n){ zahlungRef = shiftRef(zahlungRef, zahlungFilter, n); zahlungShowAll = false; render(); }

VIEWS.kat = () => {

    <button class="tap" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px" onclick="go('katdetail','${x.id}')">
      ${IC(x.k.icon_name, x.k.farbe, 36)}

          <span class="title" style="font-size:14px">${esc(x.k.name)}</span>

        </div>
        <div class="progress"><i style="width:${(x.betrag/max*100).toFixed(1)}%;
          background:linear-gradient(90deg,${x.k.farbe},${tint(x.k.farbe,.55)})"></i></div>
      </div>
    </button>`).join(''); })()}</div></div>`:''}</section>`;
};

/* ---------- Kategorie-Detail ---------- */
VIEWS.katdetail = kid => {
  const k = kat(kid);
  const alle = DB.tx.filter(t => t.kategorie === kid).sort((a,b) => b.datum.localeCompare(a.datum));

  const summe = Calc.summe(imZeitraum);

  const vorMonat = (() => { const d = parse(katFilter.ym + '-01'); d.setMonth(d.getMonth()-1);
    return Calc.summe(alle.filter(t => ymKey(t.datum) === ymKey(d))); })();
  const st = Calc.budgetStatus(kid, katFilter.ym);
  const monatsWerte = [...Array(6)].map((_,i) => { const d = parse(katFilter.ym + '-01'); d.setMonth(d.getMonth()-5+i);
    return { label:MON_K[d.getMonth()], wert:Calc.summe(alle.filter(t => ymKey(t.datum) === ymKey(d))) }; });

  return `
  <div class="card" style="margin-top:var(--s1);display:flex;align-items:center;gap:14px">
    ${IC(k.icon_name, k.farbe, 40)}

  <section class="section">

  </section>

  ${abgelaufen.length ? `<section class="section">

function garRow(g){
  const tage = bisHeute(g.garantie_enddatum);
  const gesamt = Math.max(1, dTage(g.garantie_enddatum, g.kaufdatum));
  const rest = Math.max(0, Math.min(100, tage/gesamt*100));
  const farbe = tage < 0 ? '#6b7280' : tage <= 30 ? '#d64545' : tage <= 90 ? '#ff9500' : '#2d9d78';
  const k = kat(g.kategorie);
  return `<button class="row" style="text-align:left;width:100%" onclick="Modals.garDetail('${g.id}')">
    ${IC(k.icon_name, k.farbe, 40)}
    <div class="row-main">
      <div class="row-name">${esc(g.produktname)}</div>
      <div class="row-sub">${esc(g.haendler || k.name)} · bis ${dKurz(g.garantie_enddatum)}</div>
    </div>
    ${Chart.gauge(rest, farbe, tage < 0 ? 'vorbei' : 'Tage', tage < 0 ? '–' : String(tage), 52, 5)}
  </button>`;
}

/* ---------- 9b. GARANTIE-KALENDER ---------- */
let calState = { ym: ymKey(new Date()), sel: today() };
VIEWS.kalender = () => {
  const [y, m] = calState.ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), tage = new Date(y, m, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const ev = eventsMap(y, m);
  let zellen = '';
  for(let i=0;i<offset;i++) zellen += `<div class="day off"></div>`;
  for(let d=1; d<=tage; d++){
    const key = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const punkte = (ev[key]||[]).slice(0,3).map(e => `<i style="background:${e.farbe}"></i>`).join('');
    zellen += `<button class="day ${key===today()?'today':''} ${key===calState.sel?'sel':''}" onclick="selTag('${key}')">
      ${d}<span class="dots">${punkte}</span></button>`;
  }
  const tagesEvents = ev[calState.sel] || [];

  return `
  <div class="card" style="margin-top:var(--s1)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)">
      <button class="icon-btn" style="box-shadow:none;background:var(--card-2)" onclick="shiftCal(-1)" aria-label="Vorheriger Monat">${I('left')}</button>
      <div class="title">${MONATE[m-1]} ${y}</div>
      <button class="icon-btn" style="box-shadow:none;background:var(--card-2)" onclick="shiftCal(1)" aria-label="Nächster Monat">${I('right')}</button>
    </div>
    <div class="cal">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}${zellen}</div>
    <div class="legend">
      <div><i style="background:#d64545"></i>Garantie läuft ab</div>
      <div><i style="background:#ff9500"></i>Abo fällig</div>
      <div><i style="background:#2d9d78"></i>Spar-Meilenstein</div>
      <div><i style="background:#8b5cf6"></i>Eigenes Ereignis</div>
    </div>
  </div>

  <section class="section">
    <div class="section-head"><div class="section-title">${dLang(calState.sel)}</div>
      <button class="section-link" onclick="Modals.ereignis('${calState.sel}')">+ Ereignis</button></div>
    ${tagesEvents.length ? `<div class="stack">${tagesEvents.map(e => e.custom ? `
      <button class="alert" style="text-align:left;width:100%" onclick="Modals.ereignis(null,'${e.id}')">${IC(e.icon, e.farbe, 40)}
        <div class="txt"><b>${esc(e.titel)}</b>${e.sub?`<span>${esc(e.sub)}</span>`:''}</div></button>` : `
      <div class="alert">${IC(e.icon, e.farbe, 40)}
        <div class="txt"><b>${esc(e.titel)}</b><span>${esc(e.sub)}</span></div></div>`).join('')}</div>`
      : `<div class="card">${empty('cal','Nichts an diesem Tag','Wähle einen markierten Tag, um Termine zu sehen.')}</div>`}
  </section>`;
};
function eventsMap(y, m){
  const map = {};
  const add = (datum, e) => { (map[datum] = map[datum] || []).push(e); };
  DB.ga.forEach(g => { const d = parse(g.garantie_enddatum);
    if(d.getFullYear()===y && d.getMonth()===m-1)
      add(g.garantie_enddatum, { farbe:'#d64545', icon:'shield', titel:'Garantie endet: ' + g.produktname,
        sub:`${g.haendler || 'Händler unbekannt'} · gekauft am ${dKurz(g.kaufdatum)}` }); });
  DB.ab.filter(a => a.aktiv).forEach(a => {
    const start = parse(a.startdatum); const d = new Date(start);
    for(let i=0;i<400;i++){
      if(d.getFullYear()===y && d.getMonth()===m-1){

      if(a.frequenz==='monatlich') d.setMonth(d.getMonth()+1); else d.setFullYear(d.getFullYear()+1);
    }});
  DB.sp.forEach(s => { const d = parse(s.hinzugefuegt_am);

  return map;
}

function eventsMap(y,m){

  const end=new Date(y,m,0,23,59,59);
  DB.ab.filter(a=>a.aktiv!==false).forEach(a=>{const d=parse(a.startdatum);let guard=0;while(d<=end&&guard++<600){if(d.getFullYear()===y&&d.getMonth()===m-1)add(iso(d),{farbe:'#ff9500',icon:'repeat',titel:a.name+' wird abgebucht',sub:`${eur(a.betrag)} · ${a.frequenz}`});if(a.frequenz==='monatlich')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);}});
  DB.sp.forEach(s=>{const d=parse(s.hinzugefuegt_am);if(d.getFullYear()===y&&d.getMonth()===m-1)add(s.hinzugefuegt_am,{farbe:'#2d9d78',icon:'heart',titel:'Gespart: '+eur(s.betrag),sub:s.notiz||'Rücklage für '+s.monat});});
  DB.ev.forEach(e=>{const d=parse(e.datum);if(d.getFullYear()===y&&d.getMonth()===m-1)add(e.datum,{farbe:e.farbe,icon:'cal',titel:e.titel,sub:e.text||'',custom:true,id:e.id});});
  return map;
}
/* ---------- 11. STATISTIKEN ---------- */
let statFilter = { modus:'jahr', von:null, bis:null, ref:new Date() };
function statZeitraum(){
  const n = statFilter.ref || new Date();
  if(statFilter.modus==='tag') return [iso(n), iso(n), dLang(iso(n))];
  if(statFilter.modus==='woche'){ const von=montag(n), bis=new Date(von.getTime()+6*864e5);
    let bisIso=iso(bis); if(bisIso>today()) bisIso=today();
    return [iso(von), bisIso, `KW ${kw(von)} · ${dKurz(iso(von))} – ${dKurz(iso(bis))}`]; }
  if(statFilter.modus==='monat'){ let bisIso=iso(new Date(n.getFullYear(), n.getMonth()+1, 0)); if(bisIso>today()) bisIso=today();
    return [iso(new Date(n.getFullYear(), n.getMonth(), 1)), bisIso, MONATE[n.getMonth()] + ' ' + n.getFullYear()]; }
  if(statFilter.modus==='quartal'){ const q = Math.floor(n.getMonth()/3);
    return [iso(new Date(n.getFullYear(), q*3, 1)), today(), 'Q' + (q+1) + ' ' + n.getFullYear()]; }
  if(statFilter.modus==='custom' && statFilter.von && statFilter.bis)
    return [statFilter.von, statFilter.bis, dKurz(statFilter.von) + ' – ' + dKurz(statFilter.bis)];
  let bisIso=iso(new Date(n.getFullYear(), 11, 31)); if(bisIso>today()) bisIso=today();
  return [iso(new Date(n.getFullYear(), 0, 1)), bisIso, String(n.getFullYear())];
}
/* Zerlegt einen Monat in fortlaufende 7-Tage-Blöcke ("Woche 1", "Woche 2", ...) */
function monatsWochen(y, m){
  const start = new Date(y, m-1, 1), ende = new Date(y, m, 0);
  const weeks = []; let d = new Date(start), n = 1;
  while(d <= ende){
    const wEnde = new Date(Math.min(new Date(d.getTime()+6*864e5).getTime(), ende.getTime()));
    weeks.push({ label:'W' + n, von:iso(d), bis:iso(wEnde) });
    n++; d = new Date(wEnde.getTime()+864e5);
  }
  return weeks;
}
/* Liefert Diagramm-Daten passend zum gewählten Zeitraum: Tag→Stunden, Woche→Mo-So, Monat→Wochen, Jahr→Monate */
function statSeries(){
  const n = statFilter.ref || new Date();
  if(statFilter.modus === 'tag'){
    const tagIso = iso(n);
    const stunde = t => t.zeit ? parseInt(t.zeit.slice(0,2),10) : 12; // ohne erfasste Uhrzeit: auf 12 Uhr geschätzt, damit die Summe stimmt
    const labels = [...Array(24)].map((_,h) => String(h).padStart(2,'0') + ':00');
    const txHeute = DB.tx.filter(t => t.datum === tagIso);
    const spHeute = DB.sp.filter(s => s.hinzugefuegt_am === tagIso);
    const ausReihe = [...Array(24)].map((_,h) => txHeute.filter(t => stunde(t)===h).reduce((s,t)=>s+(+t.betrag||0),0));
    const sparReihe = [...Array(24)].map((_,h) => spHeute.filter(s => stunde(s)===h).reduce((v,s)=>v+(+s.betrag||0),0));
    const ohneZeit = txHeute.filter(t => !t.zeit).length;
    return { ausReihe, sparReihe, labels, einheit:'Stunden', hinweis: ohneZeit ? `${ohneZeit} Buchung${ohneZeit>1?'en':''} ohne erfasste Uhrzeit auf 12:00 Uhr geschätzt` : null };
  }
  if(statFilter.modus === 'woche'){
    const von = montag(n);
    const tage = [...Array(7)].map((_,i) => iso(new Date(von.getTime()+i*864e5)));
    const ausReihe = tage.map(dt => Calc.summe(DB.tx.filter(t=>t.datum===dt)));
    const sparReihe = tage.map(dt => DB.sp.filter(s=>s.hinzugefuegt_am===dt).reduce((v,s)=>v+(+s.betrag||0),0));
    return { ausReihe, sparReihe, labels:DOW.slice(), einheit:'Tage' };
  }
  if(statFilter.modus === 'monat'){
    const wochen = monatsWochen(n.getFullYear(), n.getMonth()+1);
    const ausReihe = wochen.map(w => Calc.summe(Calc.txIn(w.von, w.bis)));
    const sparReihe = wochen.map(w => DB.sp.filter(s=>s.hinzugefuegt_am>=w.von && s.hinzugefuegt_am<=w.bis).reduce((v,s)=>v+(+s.betrag||0),0));
    return { ausReihe, sparReihe, labels:wochen.map(w=>w.label), einheit:'Wochen' };
  }
  if(statFilter.modus === 'jahr'){
    const monate = [...Array(12)].map((_,i) => new Date(n.getFullYear(), i, 1));
    const ausReihe = monate.map(d => Calc.summe(DB.tx.filter(t => ymKey(t.datum)===ymKey(d))));
    const sparReihe = monate.map(d => DB.sp.filter(s => ymKey(s.hinzugefuegt_am)===ymKey(d)).reduce((a,s)=>a+ +s.betrag,0));
    return { ausReihe, sparReihe, labels:monate.map(d=>MON_K[d.getMonth()]), einheit:'Monate' };
  }
  /* Custom/Quartal: wie bisher gleitende letzte 12 Monate */
  const monate = [...Array(12)].map((_,i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-11+i); return d; });
  const ausReihe = monate.map(d => Calc.summe(DB.tx.filter(t => ymKey(t.datum)===ymKey(d))));
  const sparReihe = monate.map(d => DB.sp.filter(s => ymKey(s.hinzugefuegt_am)===ymKey(d)).reduce((a,s)=>a+ +s.betrag,0));
  return { ausReihe, sparReihe, labels:monate.map(d=>MON_K[d.getMonth()]), einheit:'Monate' };
}
